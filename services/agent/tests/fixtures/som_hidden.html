<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>SoM hidden field fixture</title>
  <!-- 사이트 머리의 숨은 검색칸처럼, 안 보이는 입력칸이 보이는 글 위에 겹쳐 있다.
       막을 그리면 그 아래 글이 가려진다 -->
  <style>
    .banner { position: relative; height: 120px; font: 24px sans-serif; }
    .banner input { position: absolute; top: 0; width: 300px; height: 40px; }
  </style>
</head>
<body>
  <div class="banner">
    배너 제목 — 이 글은 가려지면 안 된다
    <input name="hidden" type="text" value="숨은 값" style="left: 0; visibility: hidden">
    <input name="transparent" type="text" value="투명 값" style="left: 320px; opacity: 0">
  </div>
  <input name="faded" type="text" value="반투명 값" style="opacity: 0.5">
  <input name="plain" type="text" value="보통 값">
</body>
</html>
