<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>SoM redirect fixture</title>
</head>
<body>
  <!-- "로그인 성공, 잠시 후 이동" 처럼 로드 직후 스크립트가 다른 페이지로 넘긴다.
       넘기기까지의 지연(ms)은 주소의 ?ms= 로 받는다. 관측 도중 문서가 바뀐다 -->
  <p>로그인 성공. 잠시 후 이동합니다.</p>
  <a href="som_page.html">바로 이동</a>
  <script>
    setTimeout(() => {
      location.href = 'som_page.html';
    }, Number(new URLSearchParams(location.search).get('ms')));
  </script>
</body>
</html>
