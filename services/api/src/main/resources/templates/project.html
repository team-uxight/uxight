<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${project.title}">프로젝트 상세</title>
</head>
<body>
<h1 th:text="${project.title}"></h1>
<div th:if="${errorMessage != null}">
    <p th:text="${errorMessage}"></p>
</div>
<form th:action="@{/projects/{projectId}/runs(projectId=${project.projectId})}" method="post">
    <div>
        <label for="targetUrl">대상 URL</label>
        <input type="text" id="targetUrl" th:value="${project.targetUrl}" readonly>
    </div>
    <div>
        <label for="goal">Task</label>
        <input type="text" id="goal" name="goal">
    </div>
    <div>
        <label for="personaIds">페르소나</label>
        <select id="personaIds" name="personaIds">
            <option th:each="persona : ${personas}" th:value="${persona.personaId}" th:text="${persona.name}"></option>
        </select>
    </div>
    <button type="submit">런 요청</button>
</form>
</body>
</html>
