<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>히스토리</title>
    <style>
        .history-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .history-box {
            border: 1px solid #000;
            padding: 12px;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <a th:href="@{/dashboard}">Dashboard</a>
    </nav>
</header>
<h1>히스토리</h1>
<div class="history-grid">
    <div class="history-box" th:each="item : ${history}">
        <p th:text="${item.endType}"></p>
        <p th:text="${item.projectTitle}"></p>
        <p th:text="${item.taskGoal}"></p>
        <p th:text="${item.elapsedDisplay}"></p>
        <p th:text="|진행 결과 ${item.completedPersonas}/${item.totalPersonas} Persona|"></p>
        <progress th:value="${item.completedPersonas}" th:max="${item.totalPersonas}"></progress>
    </div>
</div>
</body>
</html>
