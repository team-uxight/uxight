spring:
  datasource:
    url: jdbc:h2:mem:uxight;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa.hibernate.ddl-auto: create-drop
  flyway.enabled: false
uxight:
  agent-base-url: http://127.0.0.1:1   # 테스트에서는 agent 없음 → 호출 실패해도 202
  auth:
    jwt-secret: test-secret-at-least-32-bytes-long
    access-token-ttl: 1h
    refresh-token-ttl: 14d
    google-client-id: ""
