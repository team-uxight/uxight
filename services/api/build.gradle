plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
}

group = 'com.uxight'
version = '0.0.1-SNAPSHOT'
description = 'UXight API — CRUD · 인증 · 조회 (실행은 services/agent)'

java {
  toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
  implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'   // ddl-auto: none — 스키마는 Flyway
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.security:spring-security-crypto'   // 비밀번호 해시(BCrypt)만. 필터 체인은 쓰지 않는다
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'
  runtimeOnly 'com.mysql:mysql-connector-j'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
  annotationProcessor 'org.projectlombok:lombok'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
