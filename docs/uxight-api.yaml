openapi: 3.1.0
info:
  title: UXight REST API (FE-BE)
  version: 0.2.0
  description: |-
    UXight 프로젝트에서 프론트엔드(SPA)와 백엔드(Spring) 간 통신에 사용되는 REST API 명세이다.
    기준 문서는 '서비스 REST API 설계'(7.3)와 '오류 코드 및 오류 파일 설계'(8.4)이고, 두 문서에 없는 동작은 design-decision.md를 따른다.

    **규칙**
    - 모든 API는 /api로 시작하고, 관리자 전용 API는 /api/admin으로 시작한다.
    - 로그인이 필요한 API는 Authorization 헤더에 Bearer access 토큰을 보낸다.
    - 본인 소유가 아닌 자원에 접근하면 403 대신 자원이 없는 경우와 같은 404 코드로 응답해 자원의 존재 자체를 숨긴다. 조회 조건을 충족하지 않는 자원(done이 아닌 회차의 진단과 개선안, 진단 근거나 Before/After 범위 밖의 스크린샷)도 마찬가지다.
    - 실패 응답 본문은 모든 API가 같은 형식(code, message, fieldErrors)을 사용한다. HTTP 상태 코드가 같아도 원인이 다르면 code가 다르다.
    - 각 실패 응답의 설명에 code를 적고, examples에 code별 본문을 둔다.
    - 다음 오류는 개별 응답에 적지 않는다. 경로 변수가 있는 API의 GLB-ERR-001(400, 경로 변수 타입 불일치)과, 모든 API의 GLB-ERR-003(404, 존재하지 않는 API), GLB-ERR-004(405, 허용되지 않은 메서드), GLB-ERR-005(500, 내부 서버 오류)이다.
    - 경로 변수가 실험을 가리키면 firstRunId, 회차를 가리키면 runId로 쓴다.
    - JSON 필드 이름은 camelCase를 사용한다.
    - 목록은 배열을 그대로 응답하지 않고 이름 붙은 필드(projects 등)에 담는다.
    - 페이지 정보는 content와 같은 단계에 page(현재 페이지 번호), size, totalElements, totalPages로 담는다.
    - 값이 없는 필드는 생략하지 않고 null로 보낸다.
    - 시각 필드는 date-time 형식으로 표기했으며, 시간대 기준은 미결이다.

    **용어**
    - 실험: 리서처가 한 번 요청한 단위로, 최초 회차부터 마지막 회차까지를 말한다. 실험은 최초 회차의 runId로 식별한다.
    - 회차: 실험 안에서 수행되는 시뮬레이션부터 mode의 마지막 단계까지의 흐름 1회로, runs 테이블의 한 행이다.
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버(예시)
security:
  - bearerAuth: []
tags:
  - name: 회원가입
  - name: 로그인
  - name: 로그아웃
  - name: 대시보드
  - name: 프로젝트 관리
  - name: 실험 관리
  - name: 행동 로그 관리
  - name: 진단 관리
  - name: 개선안/다음 회차 관리
  - name: 결과 관리
  - name: 계정 관리
  - name: 정책 관리
  - name: 실험 강제 중단
  - name: 감사 로그 관리

paths:

  # ───────── 1. 회원가입, 2. 로그인, 3. 로그아웃 ─────────

  /api/auth/signup:
    post:
      tags: [회원가입]
      operationId: signup
      summary: 이메일 회원가입
      description: 인증 메일은 보내지 않으며, 가입 계정은 리서처로 시작한다. 토큰은 발급하지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 'AUT-ERR-007: 이메일 중복'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUT-ERR-007:
                  $ref: '#/components/examples/AUT-ERR-007'

  /api/auth/google:
    post:
      tags: [회원가입, 로그인]
      operationId: loginWithGoogle
      summary: Google 회원가입 및 로그인
      description: |-
        프론트엔드가 Google에서 받은 ID 토큰을 보낸다. 처음 보는 Google 계정이면 가입 후 로그인 처리한다.
        같은 이메일로 이메일 가입한 계정이 있으면 연결하지 않고 409로 거절한다. 이메일 가입은 인증 메일이 없어 이메일 소유를 확인하지 않기 때문이다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: 로그인 완료. refresh 토큰은 HttpOnly 쿠키로 전달한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |-
            - AUT-ERR-003: ID 토큰 검증 실패
            - AUT-ERR-005: 비활성 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUT-ERR-003:
                  $ref: '#/components/examples/AUT-ERR-003'
                AUT-ERR-005:
                  $ref: '#/components/examples/AUT-ERR-005'
        '409':
          description: 'AUT-ERR-008: 같은 이메일의 이메일 가입 계정이 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUT-ERR-008:
                  $ref: '#/components/examples/AUT-ERR-008'

  /api/auth/login:
    post:
      tags: [로그인]
      operationId: login
      summary: 이메일 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 완료. refresh 토큰은 HttpOnly 쿠키로 전달한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |-
            - AUT-ERR-002: 이메일 또는 비밀번호가 틀림. 이메일이 없는 경우와 비밀번호가 틀린 경우를 구분하지 않는다.
            - AUT-ERR-005: 비활성 계정. 비밀번호를 확인한 뒤에 알린다. 비밀번호를 모르는 사람에게 계정이 있다는 것을 알리지 않기 위해서다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUT-ERR-002:
                  $ref: '#/components/examples/AUT-ERR-002'
                AUT-ERR-005:
                  $ref: '#/components/examples/AUT-ERR-005'

  /api/auth/refresh:
    post:
      tags: [로그인]
      operationId: refreshAccessToken
      summary: access 토큰 재발급
      description: refresh 토큰은 교체(rotation)하지 않는다. 재발급할 때도 계정의 활성 여부를 확인한다.
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: 재발급 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: |-
            - AUT-ERR-004: refresh 토큰이 없거나 만료 또는 무효화됨
            - AUT-ERR-005: 비활성 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUT-ERR-004:
                  $ref: '#/components/examples/AUT-ERR-004'
                AUT-ERR-005:
                  $ref: '#/components/examples/AUT-ERR-005'

  /api/auth/logout:
    post:
      tags: [로그아웃]
      operationId: logout
      summary: 로그아웃
      description: refresh 토큰을 무효화하고 쿠키를 삭제한다.
      security:
        - refreshTokenCookie: []
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            Set-Cookie:
              description: refresh 토큰 쿠키 삭제
              schema:
                type: string
                examples:
                  - refreshToken=; Max-Age=0

  # ───────── 4. 대시보드 ─────────

  /api/users/me:
    get:
      tags: [대시보드]
      operationId: getMe
      summary: 로그인 사용자 조회
      description: 로그인 사용자 이름 표시와 관리자 메뉴 노출 여부 판단에 쓴다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects:
    get:
      tags: [대시보드]
      operationId: listProjects
      summary: 본인 프로젝트 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [프로젝트 관리]
      operationId: createProject
      summary: 프로젝트 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────── 5. 프로젝트 관리 ─────────

  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [프로젝트 관리]
      operationId: getProject
      summary: 프로젝트 상세 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    patch:
      tags: [프로젝트 관리]
      operationId: updateProject
      summary: 프로젝트 수정
      description: 변경할 항목만 보낸다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: 수정된 프로젝트 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    delete:
      tags: [프로젝트 관리]
      operationId: deleteProject
      summary: 프로젝트 삭제
      description: 삭제 방식(실제 삭제, 삭제 표시)과 로그 파일 정리는 미결이다.
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: 'EXP-ERR-004: 진행 중인 실험이 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-004:
                  $ref: '#/components/examples/EXP-ERR-004'

  /api/personas:
    get:
      tags: [프로젝트 관리]
      operationId: listPersonas
      summary: Persona 목록 조회
      description: 실험 요청 폼의 Persona 선택 목록이다. 본인 소유 Persona와 공용 Persona를 함께 조회한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/{projectId}/test-accounts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [프로젝트 관리]
      operationId: createTestAccount
      summary: 테스트 계정 등록
      description: 로그인이 필요한 대상을 위해 프로젝트에 테스트 계정을 등록한다. 비밀번호는 Spring이 암호화해 저장한다. 등록한 계정은 수정할 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAccountCreateRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAccountCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: 'PRJ-ERR-003: 같은 프로젝트에 같은 loginId가 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PRJ-ERR-003:
                  $ref: '#/components/examples/PRJ-ERR-003'
    get:
      tags: [프로젝트 관리]
      operationId: listTestAccounts
      summary: 테스트 계정 목록 조회
      description: 비밀번호는 반환하지 않는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAccountListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

  /api/projects/{projectId}/test-accounts/{testAccountId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TestAccountId'
    delete:
      tags: [프로젝트 관리]
      operationId: deleteTestAccount
      summary: 테스트 계정 삭제
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |-
            - PRJ-ERR-001: 프로젝트가 없거나 본인 소유가 아님
            - PRJ-ERR-002: 테스트 계정이 없거나 이 프로젝트의 계정이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PRJ-ERR-001:
                  $ref: '#/components/examples/PRJ-ERR-001'
                PRJ-ERR-002:
                  $ref: '#/components/examples/PRJ-ERR-002'
        '409':
          description: 'EXP-ERR-004: 진행 중인 실험이 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-004:
                  $ref: '#/components/examples/EXP-ERR-004'

  # ───────── 6. 실험 관리 ─────────

  /api/projects/{projectId}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [실험 관리]
      operationId: createExperiment
      summary: 실험 요청
      description: |-
        성공 기준 생성, Task 생성, 최초 회차 생성을 함께 처리한다. 실행 결과를 기다리지 않고 최초 회차의 runId를 반환하며, 결과는 나중에 조회한다.
        성공 기준 생성 Agent 호출은 응답 전에 동기로 수행하므로 다른 API보다 응답이 늦다.
        mode가 loop인데 loopMax가 없으면 400(GLB-ERR-002)이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreateRequest'
      responses:
        '201':
          description: 실험 요청 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |-
            - PRJ-ERR-001: 프로젝트가 없거나 본인 소유가 아님
            - EXP-ERR-003: 선택한 Persona가 없거나, 본인 소유도 공용도 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PRJ-ERR-001:
                  $ref: '#/components/examples/PRJ-ERR-001'
                EXP-ERR-003:
                  $ref: '#/components/examples/EXP-ERR-003'
        '409':
          description: |-
            - EXP-ERR-004: 같은 프로젝트에 진행 중인 실험이 있음
            - EXP-ERR-005: 테스트 계정이 있고 그 수가 선택한 Persona 수보다 적음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-004:
                  $ref: '#/components/examples/EXP-ERR-004'
                EXP-ERR-005:
                  $ref: '#/components/examples/EXP-ERR-005'
        '502':
          description: 'EXP-ERR-007: 성공 기준 생성 Agent 호출 실패(실패 응답, 연결 실패)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-007:
                  $ref: '#/components/examples/EXP-ERR-007'
        '504':
          description: 'EXP-ERR-008: 성공 기준 생성 Agent 호출 타임아웃'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-008:
                  $ref: '#/components/examples/EXP-ERR-008'

  /api/runs:
    get:
      tags: [실험 관리]
      operationId: listExperiments
      summary: 실험 목록 조회
      description: |-
        본인의 실험을 최근 요청 순으로 조회한다.
        마지막 회차의 status가 queued, accepted, running인 실험이 화면에 있으면 프론트엔드가 3초 간격으로 호출한다.
      parameters:
        - name: state
          in: query
          required: false
          description: 실험 분류. 생략하면 전체를 조회한다.
          schema:
            $ref: '#/components/schemas/ExperimentState'
        - name: keyword
          in: query
          required: false
          description: 프로젝트 제목, Task 목표 검색어
          schema:
            type: string
        - name: finishedFrom
          in: query
          required: false
          description: |-
            완료 시각이 이 시각 이후인 실험만 조회한다. 완료 시각은 마지막 회차의 종료 시각이고, 개선안 전부 반려로 끝난 실험은 마지막 반려 시각이다.
            실험 이력에서 '이번 주 완료'로 이동할 때 GET /api/runs/stats의 thisWeekFrom 값을 넘긴다.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/runs/stats:
    get:
      tags: [실험 관리]
      operationId: getExperimentStats
      summary: 실험 건수와 총 소요 토큰 조회
      description: 실험 모니터링의 건수와 총 소요 토큰, 실험 이력의 건수를 조회한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/runs/{firstRunId}/cancel:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    post:
      tags: [실험 관리]
      operationId: cancelExperiment
      summary: 실험 취소 요청
      description: |-
        본인의 진행 중이거나 승인 대기 중인 실험을 취소 요청한다. 서버는 취소 요청을 접수만 하고 실제 취소는 AI 모듈이 나중에 수행하므로 202로 응답한다.
        승인 대기 중인 실험은 기록하는 즉시 취소가 끝나지만, 응답은 같은 202로 통일한다.
        취소 요청된 실험(취소된 실험 포함)은 상태와 관계없이 202를 응답한다(멱등).
      responses:
        '202':
          description: 취소 요청 접수
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ExperimentNotFound'
        '409':
          description: 'EXP-ERR-006: 취소 요청이 없고, 진행 중이거나 승인 대기 중인 실험도 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-006:
                  $ref: '#/components/examples/EXP-ERR-006'

  /api/runs/{firstRunId}/rounds:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    get:
      tags: [실험 관리]
      operationId: listRounds
      summary: 실험 회차 목록 조회
      description: 실험 모니터링에서 실험의 회차 목록을 조회한다. status가 done인 회차에서 진단 결과로 이동할 수 있다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ExperimentNotFound'

  /api/admin/runs:
    get:
      tags: [실험 관리]
      operationId: listAdminExperiments
      summary: 전체 실험 목록 조회
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExperimentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/runs/{firstRunId}/rounds:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    get:
      tags: [실험 관리]
      operationId: listAdminRounds
      summary: 실험 회차 목록 조회(관리자)
      description: 실험의 회차 목록과 회차별 Persona 실행 결과를 조회한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoundListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ExperimentNotFound'

  # ───────── 7. 행동 로그 관리 ─────────

  /api/admin/runs/{runId}/personas/{personaId}/steps:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PersonaIdPath'
    get:
      tags: [행동 로그 관리]
      operationId: listStepLogs
      summary: Persona별 step 로그 조회
      description: 회차의 Persona별 step 로그를 조회한다. 행동 로그 스키마는 미정이다(PM, AI 파트와 논의 필요).
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |-
            - EXP-ERR-002: 회차가 없음
            - LOG-ERR-001: 그 회차에 해당 Persona의 step 로그가 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-002:
                  $ref: '#/components/examples/EXP-ERR-002'
                LOG-ERR-001:
                  $ref: '#/components/examples/LOG-ERR-001'

  /api/admin/runs/{runId}/personas/{personaId}/steps/{step}/screenshot:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PersonaIdPath'
      - $ref: '#/components/parameters/StepPath'
    get:
      tags: [행동 로그 관리]
      operationId: getStepScreenshot
      summary: step별 스크린샷 조회
      description: 프론트엔드는 Authorization 헤더를 붙여 fetch로 받는다. img 태그의 src로는 헤더를 붙일 수 없기 때문이다.
      responses:
        '200':
          description: 스크린샷 이미지
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |-
            - EXP-ERR-002: 회차가 없음
            - LOG-ERR-002: 스크린샷이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-002:
                  $ref: '#/components/examples/EXP-ERR-002'
                LOG-ERR-002:
                  $ref: '#/components/examples/LOG-ERR-002'

  # ───────── 8. 진단 관리 ─────────

  /api/runs/{runId}/findings:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [진단 관리]
      operationId: listFindings
      summary: 진단 목록 조회
      description: |-
        회차 목록의 '진단 결과'로 들어와 그 회차의 진단 목록을 조회한다.
        응답의 회차 정보(run)는 메뉴로 다시 들어온 화면을 runId 하나로 다시 그리는 데 쓴다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RoundNotFound'

  /api/findings/stats:
    get:
      tags: [진단 관리]
      operationId: getFindingStats
      summary: Friction Taxonomy 분포 조회
      description: 실험 이력의 Friction Taxonomy 분포 그래프에 쓴다. 실험별 최초 회차의 진단을 집계하며, 최초 회차가 done이 아니면 집계하지 않는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/findings/{findingId}:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [진단 관리]
      operationId: getFinding
      summary: 진단 상세 조회
      description: |-
        진단 결과의 '근거 보기'로 진단의 Taxonomy 분류, 심각도, 근거 step을 조회한다.
        근거 스크린샷은 GET /api/findings/{findingId}/screenshots로 받는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FindingNotFound'

  /api/findings/{findingId}/screenshots:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [진단 관리]
      operationId: getFindingScreenshot
      summary: 진단 근거 스크린샷 조회
      description: 스크린샷 조회는 관리자 영역이지만 진단 상세에는 근거 스크린샷이 필요해서, 해당 진단의 근거에 포함된 step만 조회되도록 범위를 좁혔다.
      parameters:
        - name: personaId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: step
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 스크린샷 이미지
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |-
            - FND-ERR-001: 진단이 없거나 본인 소유가 아님, 또는 진단의 회차가 done이 아님
            - LOG-ERR-002: 근거 범위 밖의 step이거나 스크린샷이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FND-ERR-001:
                  $ref: '#/components/examples/FND-ERR-001'
                LOG-ERR-002:
                  $ref: '#/components/examples/LOG-ERR-002'

  # ───────── 9. 개선안/다음 회차 관리 ─────────

  /api/runs/{runId}/improvements:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [개선안/다음 회차 관리]
      operationId: listImprovements
      summary: 개선안 목록 조회
      description: |-
        진단 결과의 '개선안 확인'으로 들어와 그 회차의 진단을 종합하여 산출한 개선안 목록(최대 3안)을 조회한다.
        개선안은 회차가 done으로 기록되기 전에 저장되고, 그 뒤 회차가 실패하거나 취소되어도 남는다. 그래서 회차가 done이 아니면 404를 응답한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImprovementListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RoundNotFound'

  /api/improvements/{improvementId}:
    parameters:
      - $ref: '#/components/parameters/ImprovementId'
    get:
      tags: [개선안/다음 회차 관리]
      operationId: getImprovement
      summary: 개선안 상세 조회
      description: |-
        개선안을 선택해 근거, 예상 효과, 패치 내용을 조회한다.
        승인, 반려 버튼은 awaitingApproval이 true이고 이 개선안의 approval이 null일 때만 켠다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImprovementDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ImprovementNotFound'

  /api/runs/{runId}/approvals:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [개선안/다음 회차 관리]
      operationId: decideNextRound
      summary: 다음 회차 승인 또는 반려
      description: |-
        개선안 상세에서 그 개선안으로 다음 회차를 진행할지 승인하거나 반려한다. 승인은 개선안 자체가 아니라 그 개선안을 적용한 다음 회차 진행에 대한 승인이다.
        - 승인: 해당 개선안의 패치를 적용한 다음 회차가 자동으로 시작되고, 응답의 runId에 다음 회차의 runId를 담는다. 승인할 수 있는 개선안은 회차당 최대 1개이다.
        - 반려: 해당 개선안을 다음 회차 후보에서 제외하며, 응답의 runId는 null이다. 회차의 개선안이 모두 반려되면 실험이 종료된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreateRequest'
      responses:
        '201':
          description: 결정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |-
            - EXP-ERR-002: 회차가 없거나 본인 소유가 아님
            - IMP-ERR-001: 개선안이 없거나 이 회차의 개선안이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-002:
                  $ref: '#/components/examples/EXP-ERR-002'
                IMP-ERR-001:
                  $ref: '#/components/examples/IMP-ERR-001'
        '409':
          description: |-
            - IMP-ERR-002: 다음 회차를 승인하거나 반려할 수 없는 상태(승인 가능 조건, design-decision.md 2.2). 이미 결정된 개선안도 해당한다.
            - EXP-ERR-004: 승인일 때 같은 프로젝트에 진행 중인 실험이 있음
            - EXP-ERR-005: 승인일 때 테스트 계정이 있고 그 수가 Persona 수보다 적음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                IMP-ERR-002:
                  $ref: '#/components/examples/IMP-ERR-002'
                EXP-ERR-004:
                  $ref: '#/components/examples/EXP-ERR-004'
                EXP-ERR-005:
                  $ref: '#/components/examples/EXP-ERR-005'

  # ───────── 10. 결과 관리 ─────────

  /api/runs/{firstRunId}/comparison:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    get:
      tags: [결과 관리]
      operationId: getComparison
      summary: 결과 조회
      description: |-
        실험 모니터링의 '결과'로 들어와 최초 회차(Before)와 마지막 회차(After)의 스크린샷, 지표를 비교 조회한다.
        마지막 회차는 status가 done인 회차 중 가장 최근 회차이다. done인 회차가 하나뿐이면 after는 null이다.
        Before, After에 보여줄 스크린샷의 선택 기준은 미결이다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ExperimentNotFound'
        '409':
          description: 'CMP-ERR-001: 최초 회차가 done이 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CMP-ERR-001:
                  $ref: '#/components/examples/CMP-ERR-001'

  /api/runs/{firstRunId}/comparison/screenshots:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    get:
      tags: [결과 관리]
      operationId: getComparisonScreenshot
      summary: 결과 스크린샷 조회
      parameters:
        - name: runId
          in: query
          required: true
          description: Before 또는 After 회차의 runId
          schema:
            type: integer
            format: int64
        - name: personaId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: step
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 스크린샷 이미지
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |-
            - EXP-ERR-001: 실험이 없거나 본인 소유가 아님
            - LOG-ERR-002: Before, After 범위 밖의 스크린샷이거나 스크린샷이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXP-ERR-001:
                  $ref: '#/components/examples/EXP-ERR-001'
                LOG-ERR-002:
                  $ref: '#/components/examples/LOG-ERR-002'

  # ───────── 11. 계정 관리 ─────────

  /api/admin/users:
    get:
      tags: [계정 관리]
      operationId: listUsers
      summary: 계정 목록 조회
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [계정 관리]
      operationId: changeUserRole
      summary: 계정 역할 변경
      description: 역할은 매 요청 DB에서 확인하므로 토큰 만료를 기다리지 않고 바로 반영된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleChangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: 'ACC-ERR-002: 마지막 관리자를 리서처로 바꾸려 함'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACC-ERR-002:
                  $ref: '#/components/examples/ACC-ERR-002'

  # ───────── 12. 정책 관리 ─────────

  /api/admin/policy:
    get:
      tags: [정책 관리]
      operationId: getPolicy
      summary: 전역 정책 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [정책 관리]
      operationId: updatePolicy
      summary: 전역 정책 수정
      description: |-
        변경할 항목만 보낸다. 이후 요청되는 실험부터 적용한다.
        이미 요청된 실험은 다음 회차까지 실험 요청 시점의 정책 사본으로 실행한다. 단 dailyTokenBudget은 스냅샷에 넣지 않으므로 수정하면 진행 중인 실험에도 바로 적용된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateRequest'
      responses:
        '200':
          description: 수정 후의 전역 정책
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────── 13. 실험 강제 중단 ─────────

  /api/admin/runs/cancel-all:
    post:
      tags: [실험 강제 중단]
      operationId: cancelAllExperiments
      summary: 전체 실험 중단(kill switch)
      description: |-
        status가 queued, accepted, running인 모든 회차에 취소 요청을 기록한다. 승인 대기 중인 실험은 실행 자원을 쓰지 않으므로 대상에서 뺀다.
        실제 중단은 AI 모듈이 수행하므로 202로 응답한다.
      responses:
        '202':
          description: 취소 요청 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAllResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────── 14. 감사 로그 관리 ─────────

  /api/admin/audit-logs:
    get:
      tags: [감사 로그 관리]
      operationId: listAuditLogs
      summary: 감사 로그 조회
      description: 운영 행위와 가드 차단 기록을 조회한다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: from
          in: query
          required: false
          description: 이 시각 이후의 기록만 조회한다.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 이 시각 이전의 기록만 조회한다.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: access 토큰. 토큰에는 userId만 담고, 역할과 계정 활성 여부는 매 요청 DB에서 확인한다.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: refresh 토큰. JWT가 아닌 무작위 문자열이며 HttpOnly 쿠키로만 전달한다.

  headers:
    RefreshTokenSetCookie:
      description: refresh 토큰을 담은 HttpOnly 쿠키
      schema:
        type: string
        examples:
          - refreshToken=8f3a...c21d; HttpOnly; Secure

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TestAccountId:
      name: testAccountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FirstRunId:
      name: firstRunId
      in: path
      required: true
      description: 실험의 최초 회차 runId. 최초 회차가 아닌 runId면 실험이 없는 것으로 보고 404(EXP-ERR-001)를 응답한다.
      schema:
        type: integer
        format: int64
    RunId:
      name: runId
      in: path
      required: true
      description: 회차의 runId
      schema:
        type: integer
        format: int64
    PersonaIdPath:
      name: personaId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    StepPath:
      name: step
      in: path
      required: true
      description: step 번호
      schema:
        type: integer
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ImprovementId:
      name: improvementId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: 페이지 번호. 0부터 시작한다.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        default: 20

  examples:
    GLB-ERR-001:
      value:
        code: GLB-ERR-001
        message: 잘못된 요청입니다.
        fieldErrors: []
    GLB-ERR-002:
      value:
        code: GLB-ERR-002
        message: 입력값이 올바르지 않습니다.
        fieldErrors:
          - field: email
            message: 이메일 형식이 올바르지 않습니다.
    AUT-ERR-001:
      value:
        code: AUT-ERR-001
        message: 인증이 필요합니다.
        fieldErrors: []
    AUT-ERR-002:
      value:
        code: AUT-ERR-002
        message: 이메일 또는 비밀번호가 올바르지 않습니다.
        fieldErrors: []
    AUT-ERR-003:
      value:
        code: AUT-ERR-003
        message: Google 인증에 실패했습니다.
        fieldErrors: []
    AUT-ERR-004:
      value:
        code: AUT-ERR-004
        message: 로그인이 만료되었습니다.
        fieldErrors: []
    AUT-ERR-005:
      value:
        code: AUT-ERR-005
        message: 비활성화된 계정입니다.
        fieldErrors: []
    AUT-ERR-006:
