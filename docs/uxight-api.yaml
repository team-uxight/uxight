        fieldErrors: []
    EXP-ERR-007:
      value:
        code: EXP-ERR-007
        message: 성공 기준 생성에 실패했습니다.
        fieldErrors: []
    EXP-ERR-008:
      value:
        code: EXP-ERR-008
        message: 성공 기준 생성 시간이 초과되었습니다.
        fieldErrors: []
    LOG-ERR-001:
      value:
        code: LOG-ERR-001
        message: step 로그를 찾을 수 없습니다.
        fieldErrors: []
    LOG-ERR-002:
      value:
        code: LOG-ERR-002
        message: 스크린샷을 찾을 수 없습니다.
        fieldErrors: []
    FND-ERR-001:
      value:
        code: FND-ERR-001
        message: 진단을 찾을 수 없습니다.
        fieldErrors: []
    IMP-ERR-001:
      value:
        code: IMP-ERR-001
        message: 개선안을 찾을 수 없습니다.
