openapi: 3.1.0
info:
  title: UXight REST API (FE-BE)
  version: 0.1.0
  description: |-
    UXight 프로젝트에서 프론트엔드(SPA)와 백엔드(Spring) 간 통신에 사용되는 REST API 명세이다.
    기준 문서는 '서비스 REST API 설계.md'이고, 그 문서에 없는 동작은 design-decision.md를 따른다.

    **규칙**
    - 모든 API는 /api로 시작하고, 관리자 전용 API는 /api/admin으로 시작한다.
    - 로그인이 필요한 API는 Authorization 헤더에 Bearer access 토큰을 보낸다.
    - 본인 소유가 아닌 자원에 접근하면 403 대신 404를 응답해 자원의 존재 자체를 숨긴다.
    - 실패 응답 본문은 모든 API가 같은 형식(code, message, fieldErrors)을 사용한다. HTTP 상태 코드가 같아도 원인이 다르면 code가 다르다. code 값은 오류 코드 표를 따르며, 각 응답의 설명에는 원인만 적었다.
    - 경로 변수가 실험을 가리키면 firstRunId, 회차를 가리키면 runId로 쓴다.
    - JSON 필드 이름은 camelCase를 사용한다.
    - 목록만 반환하는 API는 JSON 배열을, 다른 값과 함께 반환하는 API는 객체를 응답한다.
    - 값이 없는 필드는 생략하지 않고 null로 보낸다.
    - 시각 필드는 date-time 형식으로 표기했으며, 시간대 기준은 미결이다.

    **용어**
    - 실험: 리서처가 한 번 요청한 단위로, 최초 회차부터 마지막 회차까지를 말한다. 실험은 최초 회차의 runId로 식별한다.
    - 회차: 실험 안에서 수행되는 시뮬레이션부터 mode의 마지막 단계까지의 흐름 1회로, runs 테이블의 한 행이다.
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버(예시)
security:
  - bearerAuth: []
tags:
  - name: 회원가입
  - name: 로그인
  - name: 로그아웃
  - name: 대시보드
  - name: 프로젝트 관리
  - name: 실험 관리
  - name: 행동 로그 관리
  - name: 진단 관리
  - name: 개선안/다음 회차 관리
  - name: 결과 관리
  - name: 계정 관리
  - name: 정책 관리
  - name: 실험 강제 중단
  - name: 감사 로그 관리

paths:

  # ───────── 1. 회원가입, 2. 로그인, 3. 로그아웃 ─────────

  /api/auth/signup:
    post:
      tags: [회원가입]
      operationId: signup
      summary: 이메일 회원가입
      description: 인증 메일은 보내지 않으며, 가입 계정은 리서처로 시작한다. 토큰은 발급하지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/google:
    post:
      tags: [회원가입, 로그인]
      operationId: loginWithGoogle
      summary: Google 회원가입 및 로그인
      description: |-
        프론트엔드가 Google에서 받은 ID 토큰을 보낸다. 처음 보는 Google 계정이면 가입 후 로그인 처리한다.
        같은 이메일로 이메일 가입한 계정이 있으면 연결하지 않고 409로 거절한다. 이메일 가입은 인증 메일이 없어 이메일 소유를 확인하지 않기 때문이다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: 로그인 완료. refresh 토큰은 HttpOnly 쿠키로 전달한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: ID 토큰 검증 실패, 또는 비활성 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 같은 이메일의 이메일 가입 계정이 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [로그인]
      operationId: login
      summary: 이메일 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 완료. refresh 토큰은 HttpOnly 쿠키로 전달한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |-
            이메일 또는 비밀번호가 틀림, 또는 비활성 계정. 두 경우는 code로 구분한다.
            비활성 여부는 비밀번호를 확인한 뒤에 알린다. 비밀번호를 모르는 사람에게 계정이 있다는 것을 알리지 않기 위해서다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags: [로그인]
      operationId: refreshAccessToken
      summary: access 토큰 재발급
      description: refresh 토큰은 교체(rotation)하지 않는다. 재발급할 때도 계정의 활성 여부를 확인한다.
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: 재발급 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: refresh 토큰이 없거나 만료 또는 무효화됨, 또는 비활성 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags: [로그아웃]
      operationId: logout
      summary: 로그아웃
      description: refresh 토큰을 무효화하고 쿠키를 삭제한다.
      security:
        - refreshTokenCookie: []
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            Set-Cookie:
              description: refresh 토큰 쿠키 삭제
              schema:
                type: string

  # ───────── 4. 대시보드 ─────────

  /api/users/me:
    get:
      tags: [대시보드]
      operationId: getMe
      summary: 로그인 사용자 조회
      description: 로그인 사용자 이름 표시와 관리자 메뉴 노출 여부 판단에 쓴다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects:
    get:
      tags: [대시보드]
      operationId: listProjects
      summary: 본인 프로젝트 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [프로젝트 관리]
      operationId: createProject
      summary: 프로젝트 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────── 5. 프로젝트 관리 ─────────

  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [프로젝트 관리]
      operationId: getProject
      summary: 프로젝트 상세 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [프로젝트 관리]
      operationId: updateProject
      summary: 프로젝트 수정
      description: 변경할 항목만 보낸다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: 수정된 프로젝트 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [프로젝트 관리]
      operationId: deleteProject
      summary: 프로젝트 삭제
      description: 삭제 방식(실제 삭제, 삭제 표시)과 로그 파일 정리는 미결이다.
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 진행 중인 실험이 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/personas:
    get:
      tags: [프로젝트 관리]
      operationId: listPersonas
      summary: Persona 목록 조회
      description: 실험 요청 폼의 Persona 선택 목록이다. 본인 소유 Persona와 공용 Persona를 함께 조회한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Persona'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/{projectId}/test-accounts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [프로젝트 관리]
      operationId: createTestAccount
      summary: 테스트 계정 등록
      description: 로그인이 필요한 대상을 위해 프로젝트에 테스트 계정을 등록한다. 비밀번호는 Spring이 암호화해 저장한다. 등록한 계정은 수정할 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAccountCreateRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAccountCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 같은 프로젝트에 같은 loginId가 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [프로젝트 관리]
      operationId: listTestAccounts
      summary: 테스트 계정 목록 조회
      description: 비밀번호는 반환하지 않는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{projectId}/test-accounts/{testAccountId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TestAccountId'
    delete:
      tags: [프로젝트 관리]
      operationId: deleteTestAccount
      summary: 테스트 계정 삭제
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 진행 중인 실험이 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────── 6. 실험 관리 ─────────

  /api/projects/{projectId}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [실험 관리]
      operationId: createExperiment
      summary: 실험 요청
      description: |-
        성공 기준 생성, Task 생성, 최초 회차 생성을 함께 처리한다. 실행 결과를 기다리지 않고 최초 회차의 runId를 반환하며, 결과는 나중에 조회한다.
        성공 기준 생성 Agent 호출은 응답 전에 동기로 수행하므로 다른 API보다 응답이 늦다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreateRequest'
      responses:
        '201':
          description: 실험 요청 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentCreateResponse'
        '400':
          description: 요청 값 검증 실패. mode가 loop인데 loopMax가 없는 경우와, personaIds에 본인 소유도 공용도 아닌 Persona가 있는 경우를 포함한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 진행 중인 실험이 있음, 또는 테스트 계정이 있고 그 수가 선택한 Persona 수보다 적음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 성공 기준 생성 Agent 호출 실패(실패 응답, 연결 실패)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: 성공 기준 생성 Agent 호출 타임아웃
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/runs:
    get:
      tags: [실험 관리]
      operationId: listExperiments
      summary: 실험 목록 조회
      description: |-
        본인의 실험을 최근 요청 순으로 조회한다.
        마지막 회차의 status가 queued, accepted, running인 실험이 화면에 있으면 프론트엔드가 3초 간격으로 호출한다.
      parameters:
        - name: state
          in: query
          required: false
          description: 실험 분류. 생략하면 전체를 조회한다.
          schema:
            $ref: '#/components/schemas/ExperimentState'
        - name: keyword
          in: query
          required: false
          description: 프로젝트 제목, Task 목표 검색어
          schema:
            type: string
        - name: finishedFrom
          in: query
          required: false
          description: |-
            완료 시각이 이 시각 이후인 실험만 조회한다. 완료 시각은 마지막 회차의 종료 시각이고, 개선안 전부 반려로 끝난 실험은 마지막 반려 시각이다.
            실험 이력에서 '이번 주 완료'로 이동할 때 GET /api/runs/stats의 thisWeekFrom 값을 넘긴다.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/runs/stats:
    get:
      tags: [실험 관리]
      operationId: getExperimentStats
      summary: 실험 건수와 총 소요 토큰 조회
      description: 실험 모니터링의 건수와 총 소요 토큰, 실험 이력의 건수를 조회한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/runs/{firstRunId}/cancel:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    post:
      tags: [실험 관리]
      operationId: cancelExperiment
      summary: 실험 취소 요청
      description: |-
        본인의 진행 중이거나 승인 대기 중인 실험을 취소 요청한다. 서버는 취소 요청을 접수만 하고 실제 취소는 AI 모듈이 나중에 수행하므로 202로 응답한다.
        승인 대기 중인 실험은 기록하는 즉시 취소가 끝나지만, 응답은 같은 202로 통일한다.
        이미 취소 요청된 실험도 202를 응답한다(멱등).
      responses:
        '202':
          description: 취소 요청 접수
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 진행 중이거나 승인 대기 중인 실험이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/runs/{firstRunId}/rounds:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    get:
      tags: [실험 관리]
      operationId: listRounds
      summary: 실험 회차 목록 조회
      description: 실험 모니터링에서 실험의 회차 목록을 조회한다. status가 done인 회차에서 진단 결과로 이동할 수 있다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/runs:
    get:
      tags: [실험 관리]
      operationId: listAdminExperiments
      summary: 전체 실험 목록 조회
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExperimentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/runs/{firstRunId}/rounds:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    get:
      tags: [실험 관리]
      operationId: listAdminRounds
      summary: 실험 회차 목록 조회(관리자)
      description: 실험의 회차 목록과 회차별 Persona 실행 결과를 조회한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRoundSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 실험이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────── 7. 행동 로그 관리 ─────────

  /api/admin/runs/{runId}/personas/{personaId}/steps:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PersonaIdPath'
    get:
      tags: [행동 로그 관리]
      operationId: listStepLogs
      summary: Persona별 step 로그 조회
      description: 회차의 Persona별 step 로그를 조회한다. 행동 로그 스키마는 미정이다(PM, AI 파트와 논의 필요).
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StepLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 회차 또는 그 회차의 Persona 실행이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/runs/{runId}/personas/{personaId}/steps/{step}/screenshot:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PersonaIdPath'
      - $ref: '#/components/parameters/StepPath'
    get:
      tags: [행동 로그 관리]
      operationId: getStepScreenshot
      summary: step별 스크린샷 조회
      description: 프론트엔드는 Authorization 헤더를 붙여 fetch로 받는다. img 태그의 src로는 헤더를 붙일 수 없기 때문이다.
      responses:
        '200':
          description: 스크린샷 이미지
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 스크린샷이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────── 8. 진단 관리 ─────────

  /api/runs/{runId}/findings:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [진단 관리]
      operationId: listFindings
      summary: 진단 목록 조회
      description: |-
        회차 목록의 '진단 결과'로 들어와 그 회차의 진단 목록을 조회한다.
        응답의 회차 정보는 메뉴로 다시 들어온 화면을 runId 하나로 다시 그리는 데 쓴다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 회차가 없거나 본인 소유가 아님, 또는 회차가 done이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/findings/stats:
    get:
      tags: [진단 관리]
      operationId: getFindingStats
      summary: Friction Taxonomy 분포 조회
      description: 실험 이력의 Friction Taxonomy 분포 그래프에 쓴다. 실험별 최초 회차의 진단을 집계하며, 최초 회차가 done이 아니면 집계하지 않는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyCount'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/findings/{findingId}:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [진단 관리]
      operationId: getFinding
      summary: 진단 상세 조회
      description: |-
        진단 결과의 '근거 보기'로 진단의 Taxonomy 분류, 심각도, 근거 step을 조회한다.
        근거 스크린샷은 GET /api/findings/{findingId}/screenshots로 받는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 진단이 없거나 본인 소유가 아님, 또는 진단의 회차가 done이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/findings/{findingId}/screenshots:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [진단 관리]
      operationId: getFindingScreenshot
      summary: 진단 근거 스크린샷 조회
      description: 스크린샷 조회는 관리자 영역이지만 진단 상세에는 근거 스크린샷이 필요해서, 해당 진단의 근거에 포함된 step만 조회되도록 범위를 좁혔다.
      parameters:
        - name: personaId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: step
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 스크린샷 이미지
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 진단이 없거나 본인 소유가 아님, 또는 근거 범위 밖의 step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────── 9. 개선안/다음 회차 관리 ─────────

  /api/runs/{runId}/improvements:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [개선안/다음 회차 관리]
      operationId: listImprovements
      summary: 개선안 목록 조회
      description: |-
        진단 결과의 '개선안 확인'으로 들어와 그 회차의 진단을 종합하여 산출한 개선안 목록(최대 3안)을 조회한다.
        개선안은 회차가 done으로 기록되기 전에 저장되고, 그 뒤 회차가 실패하거나 취소되어도 남는다. 그래서 회차가 done이 아니면 404를 응답한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImprovementListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 회차가 없거나 본인 소유가 아님, 또는 회차가 done이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/improvements/{improvementId}:
    parameters:
      - $ref: '#/components/parameters/ImprovementId'
    get:
      tags: [개선안/다음 회차 관리]
      operationId: getImprovement
      summary: 개선안 상세 조회
      description: |-
        개선안을 선택해 근거, 예상 효과, 패치 내용을 조회한다.
        승인, 반려 버튼은 awaitingApproval이 true이고 이 개선안의 decision이 null일 때만 켠다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImprovementDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 개선안이 없거나 본인 소유가 아님, 또는 개선안의 회차가 done이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/runs/{runId}/approvals:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [개선안/다음 회차 관리]
      operationId: decideNextRound
      summary: 다음 회차 승인 또는 반려
      description: |-
        개선안 상세에서 그 개선안으로 다음 회차를 진행할지 승인하거나 반려한다. 승인은 개선안 자체가 아니라 그 개선안을 적용한 다음 회차 진행에 대한 승인이다.
        - 승인: 해당 개선안의 패치를 적용한 다음 회차가 자동으로 시작되고, 응답에 다음 회차의 runId를 함께 반환한다. 승인할 수 있는 개선안은 회차당 최대 1개이다.
        - 반려: 해당 개선안을 다음 회차 후보에서 제외한다. 회차의 개선안이 모두 반려되면 실험이 종료된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreateRequest'
      responses:
        '201':
          description: 결정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCreateResponse'
        '400':
          description: 요청 값 검증 실패. improvementId가 이 회차의 개선안이 아닌 경우를 포함한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |-
            다음 회차를 진행할 수 없는 상태(승인 가능 조건, design-decision.md 2.2). 이미 결정된 개선안도 여기에 해당한다.
            승인일 때는 같은 프로젝트에 진행 중인 실험이 있는 경우와, 테스트 계정이 있고 그 수가 Persona 수보다 적은 경우도 409이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────── 10. 결과 관리 ─────────

  /api/runs/{firstRunId}/comparison:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    get:
      tags: [결과 관리]
      operationId: getComparison
      summary: 결과 조회
      description: |-
        실험 모니터링의 '결과'로 들어와 최초 회차(Before)와 마지막 회차(After)의 스크린샷, 지표를 비교 조회한다.
        마지막 회차는 status가 done인 회차 중 가장 최근 회차이다. done인 회차가 하나뿐이면 after는 null이다.
        Before, After에 보여줄 스크린샷의 선택 기준은 미결이다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 최초 회차가 done이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/runs/{firstRunId}/comparison/screenshots:
    parameters:
      - $ref: '#/components/parameters/FirstRunId'
    get:
      tags: [결과 관리]
      operationId: getComparisonScreenshot
      summary: 결과 스크린샷 조회
      parameters:
        - name: runId
          in: query
          required: true
          description: Before 또는 After 회차의 runId
          schema:
            type: integer
            format: int64
        - name: personaId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: step
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 스크린샷 이미지
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 실험이 없거나 본인 소유가 아님, 또는 Before, After 범위 밖의 스크린샷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────── 11. 계정 관리 ─────────

  /api/admin/users:
    get:
      tags: [계정 관리]
      operationId: listUsers
      summary: 계정 목록 조회
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [계정 관리]
      operationId: changeUserRole
      summary: 계정 역할 변경
      description: 역할은 매 요청 DB에서 확인하므로 토큰 만료를 기다리지 않고 바로 반영된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleChangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 계정이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 마지막 관리자를 리서처로 바꾸려 함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────── 12. 정책 관리 ─────────

  /api/admin/policy:
    get:
      tags: [정책 관리]
      operationId: getPolicy
      summary: 전역 정책 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [정책 관리]
      operationId: updatePolicy
      summary: 전역 정책 수정
      description: |-
        변경할 항목만 보낸다. 이후 요청되는 실험부터 적용하며, 진행 중인 실험은 시작 시점의 정책 사본으로 실행한다.
        단 dailyTokenBudget은 회차 스냅샷에 넣지 않으므로 이 규칙의 예외이다(Policy 스키마 참고).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateRequest'
      responses:
        '200':
          description: 수정 후의 전역 정책
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────── 13. 실험 강제 중단 ─────────

  /api/admin/runs/cancel-all:
    post:
      tags: [실험 강제 중단]
      operationId: cancelAllExperiments
      summary: 전체 실험 중단(kill switch)
      description: |-
        status가 queued, accepted, running인 모든 회차에 취소 요청을 기록한다. 승인 대기 중인 실험은 실행 자원을 쓰지 않으므로 대상에서 뺀다.
        실제 중단은 AI 모듈이 수행하므로 202로 응답한다.
      responses:
        '202':
          description: 취소 요청 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAllResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────── 14. 감사 로그 관리 ─────────

  /api/admin/audit-logs:
    get:
      tags: [감사 로그 관리]
      operationId: listAuditLogs
      summary: 감사 로그 조회
      description: 운영 행위와 가드 차단 기록을 조회한다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: from
          in: query
          required: false
          description: 이 시각 이후의 기록만 조회한다.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 이 시각 이전의 기록만 조회한다.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: access 토큰. 토큰에는 userId만 담고, 역할과 계정 활성 여부는 매 요청 DB에서 확인한다.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: refresh 토큰. JWT가 아닌 무작위 문자열이며 HttpOnly 쿠키로만 전달한다. 쿠키 이름은 가칭이다.

  headers:
    RefreshTokenSetCookie:
      description: refresh 토큰을 담은 HttpOnly 쿠키
      schema:
        type: string

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TestAccountId:
      name: testAccountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FirstRunId:
      name: firstRunId
      in: path
      required: true
      description: 실험의 최초 회차 runId. 최초 회차가 아닌 runId면 실험이 없는 것으로 보고 404를 응답한다.
      schema:
        type: integer
        format: int64
    RunId:
      name: runId
      in: path
      required: true
      description: 회차의 runId
      schema:
        type: integer
        format: int64
    PersonaIdPath:
      name: personaId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    StepPath:
      name: step
      in: path
      required: true
      description: step 번호
      schema:
        type: integer
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ImprovementId:
      name: improvementId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: 페이지 번호. 0부터 시작한다.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        default: 20

  responses:
    BadRequest:
      description: 요청 값 검증 실패. fieldErrors에 필드별 오류를 담는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: access 토큰이 없거나 유효하지 않음(만료 포함), 또는 비활성 계정
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 관리자가 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 자원이 없거나 본인 소유가 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ───────── 공통 ─────────

    ErrorResponse:
      type: object
      description: 모든 API의 공통 실패 응답 본문
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          description: 오류 코드. HTTP 상태 코드가 같아도 원인이 다르면 값이 다르다. 값은 오류 코드 표를 따른다.
        message:
          type: string
          description: 오류 메시지
        fieldErrors:
          type: array
          description: 필드별 검증 오류 목록. 필드 검증 오류가 아니면 빈 목록이다.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 오류가 난 필드 이름
        message:
          type: string
          description: 오류 메시지

    PageMetadata:
      type: object
      description: 페이지 정보
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          description: 페이지 크기
        number:
          type: integer
          description: 현재 페이지 번호. 0부터 시작한다.
        totalElements:
          type: integer
          format: int64
          description: 전체 항목 수
        totalPages:
          type: integer
          description: 전체 페이지 수

    # ───────── 코드값 ─────────

    Role:
      type: string
      enum: [admin, researcher]
      description: 계정 역할. admin(관리자), researcher(리서처)

    AuthProvider:
      type: string
      enum: [local, google]
      description: 가입 방식. local(이메일 가입), google(Google 가입)

    Mode:
      type: string
      enum: [diagnose, improve, loop]
      description: |-
        회차가 파이프라인을 어디까지 진행하는지 정한다. 실험 요청 시 정하고 이후 바꾸지 않는다.
        - diagnose: 1회차 진단까지
        - improve: 1회차 개선안까지. 다음 회차 없음
        - loop: 개선안, 다음 회차 승인, 다음 회차를 loopMax까지 반복

    RunStatus:
      type: string
      enum: [queued, accepted, running, done, failed, cancelled]
      description: |-
        회차 상태(runs.status). accepted는 실행 시작이 아니라 접수이며, 동시 실행 한도가 차 있으면 accepted로 자리를 기다린다.
        done은 mode의 마지막 단계(diagnose는 진단, improve와 loop는 개선안)가 끝난 상태이다.

    ExperimentState:
      type: string
      enum: [in_progress, awaiting_approval, completed, stopped]
      description: |-
        실험 분류. 마지막 회차의 status, 취소 요청, 그 회차의 개선안과 승인 기록으로 정하며 네 분류는 겹치지 않는다. 분류 기준은 design-decision.md 2.6을 따른다.
        - in_progress: 진행 중
        - awaiting_approval: 승인 대기
        - completed: 완료됨
        - stopped: 중단

    EndType:
      type: string
      enum: [cancelling, cancelled, failed]
      description: |-
        중단의 종료 유형. 마지막 회차의 status로 정한다. 코드값은 가칭이다.
        - cancelling: 취소 진행 중. status가 queued, accepted, running
        - cancelled: 취소. status가 cancelled 또는 done
        - failed: 실패. status가 failed

    PersonaRunStatus:
      type: string
      enum: [running, done, max_steps, fail, timeout, cancelled]
      description: Persona 실행 상태(run_personas.status). done이면 성공이다(메인 판정 기준).

    Taxonomy:
      type: string
      enum: [navigation_confusion, interaction_failure, task_failure, excessive_steps]
      description: |-
        Friction 유형. 전체 7종 중 4종 우선 구현이며 코드값은 가칭이다.
        - navigation_confusion: Navigation Confusion
        - interaction_failure: Interaction Failure
        - task_failure: Task Failure
        - excessive_steps: Excessive Steps

    PatchKind:
      type: string
      enum: [relabel, move, highlight, help_text]
      description: |-
        패치 종류. 코드값은 가칭이다.
        - relabel: 라벨 변경
        - move: 요소 이동
        - highlight: 요소 강조
        - help_text: 도움말 삽입

    Decision:
      type: string
      enum: [approve, reject]
      description: 다음 회차 진행에 대한 결정. approve(승인), reject(반려)

    # ───────── 인증, 계정 ─────────

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
        name:
          type: string
          maxLength: 100
          description: 표시 이름

    SignupResponse:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google이 프론트엔드에 발급한 ID 토큰

    TokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: access 토큰(JWT)

    UserMe:
      type: object
      required: [userId, name, role]
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: [string, 'null']
          description: 표시 이름
        role:
          $ref: '#/components/schemas/Role'

    AdminUser:
      type: object
      required: [userId, email, name, role, authProvider, isActive, createdAt]
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: [string, 'null']
          description: 표시 이름
        role:
          $ref: '#/components/schemas/Role'
        authProvider:
          $ref: '#/components/schemas/AuthProvider'
        isActive:
          type: boolean
          description: 계정 활성 여부
        createdAt:
          type: string
          format: date-time

    AdminUserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        page:
          $ref: '#/components/schemas/PageMetadata'

    RoleChangeRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    RoleChangeResponse:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/Role'

    # ───────── 프로젝트, Persona, 테스트 계정 ─────────

    ProjectSummary:
      type: object
      required: [projectId, title, targetUrl, description]
      properties:
        projectId:
          type: integer
          format: int64
        title:
          type: string
          description: 제목
        targetUrl:
          type: string
          description: 대상 URL(시작 URL)
        description:
          type: [string, 'null']
          description: 설명

    ProjectDetail:
      type: object
      required: [projectId, title, targetUrl, description, allowedDomains]
      properties:
        projectId:
          type: integer
          format: int64
        title:
          type: string
          description: 제목
        targetUrl:
          type: string
          description: 대상 URL(시작 URL)
        description:
          type: [string, 'null']
          description: 설명
        allowedDomains:
          type: array
          items:
            type: string
          description: 허용 도메인 목록. Agent가 이 목록 밖 도메인으로 나가려 하면 차단하고 blocked step으로 기록한다.

    ProjectCreateRequest:
      type: object
      required: [title, targetUrl, allowedDomains]
      properties:
        title:
          type: string
          maxLength: 100
        targetUrl:
          type: string
          format: uri
          maxLength: 2048
        description:
          type: [string, 'null']
          description: 설명. 길이 상한은 애플리케이션에서 정한다(미정).
        allowedDomains:
          type: array
          items:
            type: string
          description: 허용 도메인 목록

    ProjectCreateResponse:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: integer
          format: int64

    ProjectUpdateRequest:
      type: object
      description: 변경할 항목만 보낸다.
      properties:
        title:
          type: string
          maxLength: 100
        targetUrl:
          type: string
          format: uri
          maxLength: 2048
        description:
          type: [string, 'null']
        allowedDomains:
          type: array
          items:
            type: string

    Persona:
      type: object
      required: [personaId, name, profile, isCommon]
      properties:
        personaId:
          type: integer
          format: int64
        name:
          type: string
          description: 표시 이름
        profile:
          type: object
          additionalProperties: true
          description: 속성 묶음(웹 숙련도, 사용 기기, 도메인 지식, 배경). domain_knowledge는 대상 사이트 분야에 대한 상대적 수준(low, mid, high)이며, 나머지 속성의 데이터 형식은 미정이다(GACA-66).
        isCommon:
          type: boolean
          description: 관리자 소유의 공용 Persona이면 true

    TestAccountCreateRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          maxLength: 255
          description: 테스트 계정 아이디
        password:
          type: string
          format: password
          description: 테스트 계정 비밀번호. Spring이 암호화해 저장한다.

    TestAccountCreateResponse:
      type: object
      required: [testAccountId]
      properties:
        testAccountId:
          type: integer
          format: int64

    TestAccount:
      type: object
      required: [testAccountId, loginId, createdAt]
      properties:
        testAccountId:
          type: integer
          format: int64
        loginId:
          type: string
          description: 테스트 계정 아이디
        createdAt:
          type: string
          format: date-time

    # ───────── 실험, 회차 ─────────

    ExperimentCreateRequest:
      type: object
      required: [goal, successUrl, personaIds, mode]
      properties:
        goal:
          type: string
          maxLength: 200
          description: Task 목표
        successUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 성공 URL. Task 성공 판정의 보조 기준이다.
        personaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
          description: 선택한 Persona ID 목록. 본인 소유 Persona와 공용 Persona만 선택할 수 있다.
        mode:
          $ref: '#/components/schemas/Mode'
        loopMax:
          type: [integer, 'null']
          minimum: 1
          description: 최초 회차를 포함한 최대 회차 수. mode가 loop일 때 필수이다.

    ExperimentCreateResponse:
      type: object
      required: [runId]
      properties:
        runId:
          type: integer
          format: int64
          description: 최초 회차의 runId. 실험의 firstRunId와 같다.

    ExperimentSummary:
      type: object
      description: 실험 목록의 항목. runId, round, status, progress는 실험의 마지막 회차 기준이다.
      required: [firstRunId, runId, round, status, state, endType, stale, hasResult, projectTitle, taskGoal, mode, progress, personaCount, elapsedSeconds, createdAt]
      properties:
        firstRunId:
          type: integer
          format: int64
          description: 실험 식별자(최초 회차의 runId)
        runId:
          type: integer
          format: int64
          description: 마지막 회차의 runId
        round:
          type: integer
          description: 마지막 회차가 몇 번째 회차인지
        status:
          $ref: '#/components/schemas/RunStatus'
          description: 마지막 회차의 status
        state:
          $ref: '#/components/schemas/ExperimentState'
        endType:
          description: state가 stopped일 때만 값이 있고, 그 밖에는 null이다.
          anyOf:
            - $ref: '#/components/schemas/EndType'
            - type: 'null'
        stale:
          type: boolean
          description: 마지막 회차의 status가 running이고 heartbeat_at 이후 임계 시간이 지났으면 true. 표시만 하며 자동으로 failed로 바꾸지 않는다.
        hasResult:
          type: boolean
          description: 최초 회차가 done이면 true. 결과 버튼 활성화에 쓴다.
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        mode:
          $ref: '#/components/schemas/Mode'
        progress:
          type: [integer, 'null']
          description: 마지막 회차의 완료 Persona 수
        personaCount:
          type: integer
          description: 실험에 투입한 Persona 수
        elapsedSeconds:
          type: integer
          format: int64
          description: 전체 회차의 소요 시간 합(초)
        createdAt:
          type: string
          format: date-time
          description: 실험 요청 시각

    ExperimentPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'

    ExperimentStats:
      type: object
      required: [totalCount, inProgressCount, completedCount, completedThisWeekCount, awaitingApprovalCount, totalTokens, thisWeekFrom]
      properties:
        totalCount:
          type: integer
          description: 총 실험 건수. 네 분류는 겹치지 않으므로 네 분류 건수의 합과 같다.
        inProgressCount:
          type: integer
          description: 진행 중인 실험 건수
        completedCount:
          type: integer
          description: 완료된 실험 건수
        completedThisWeekCount:
          type: integer
          description: 이번 주 완료된 실험 건수. 완료 시각이 thisWeekFrom 이후인 완료된 실험이다.
        awaitingApprovalCount:
          type: integer
          description: 승인 대기 중인 실험 수
        totalTokens:
          type: integer
          format: int64
          description: 총 소요 토큰
        thisWeekFrom:
          type: string
          format: date-time
          description: 이번 주의 시작 시각. '이번 주 완료'로 이동할 때 GET /api/runs의 finishedFrom으로 넘긴다. '이번 주'의 기준(시작 요일, 시간대)은 미결이다.

    RunMetrics:
      type: object
      description: 회차 종료 시 확정된 지표(run_metrics)
      required: [successRate, avgSteps, avgBacktracks, avgSeconds, tokens, costUsd]
      properties:
        successRate:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: 성공 Persona(Persona 실행 status가 done) 비율. 0 이상 100 이하
        avgSteps:
          type: [number, 'null']
          description: 평균 step 수
        avgBacktracks:
          type: [number, 'null']
          description: 평균 뒤로가기 횟수
        avgSeconds:
          type: [number, 'null']
          description: 평균 소요 시간(초)
        tokens:
          type: [integer, 'null']
          format: int64
          description: 토큰
        costUsd:
          type: [number, 'null']
          description: 비용(USD)

    RoundSummary:
      type: object
      required: [runId, round, status, appliedImprovementId, createdAt, finishedAt, metrics]
      properties:
        runId:
          type: integer
          format: int64
        round:
          type: integer
          description: 몇 번째 회차인지
        status:
          $ref: '#/components/schemas/RunStatus'
        appliedImprovementId:
          type: [integer, 'null']
          format: int64
          description: 이 회차를 만든 승인 개선안. 최초 회차는 null이다.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        metrics:
          description: 회차의 지표. successRate를 포함한다. 확정된 지표가 없으면 null이다.
          anyOf:
            - $ref: '#/components/schemas/RunMetrics'
            - type: 'null'

    RoundListResponse:
      type: object
      required: [awaitingApproval, rounds]
      properties:
        awaitingApproval:
          type: boolean
          description: 실험이 승인 대기 중이면 true
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/RoundSummary'

    AdminExperimentSummary:
      type: object
      description: 전체 실험 목록의 항목. round, status, finishedAt은 실험의 마지막 회차 기준이다.
      required: [firstRunId, projectTitle, ownerEmail, taskGoal, mode, round, status, createdAt, finishedAt]
      properties:
        firstRunId:
          type: integer
          format: int64
        projectTitle:
          type: string
        ownerEmail:
          type: string
          description: 프로젝트 소유 리서처의 이메일
        taskGoal:
          type: string
          description: Task 목표
        mode:
          $ref: '#/components/schemas/Mode'
        round:
          type: integer
        status:
          $ref: '#/components/schemas/RunStatus'
        createdAt:
          type: string
          format: date-time
          description: 실험 요청 시각
        finishedAt:
          type: [string, 'null']
          format: date-time

    AdminExperimentPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminExperimentSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PersonaRunResult:
      type: object
      description: Persona 실행 결과(run_personas 한 행)
      required: [personaId, name, status, steps]
      properties:
        personaId:
          type: integer
          format: int64
        name:
          type: string
          description: Persona 표시 이름
        status:
          $ref: '#/components/schemas/PersonaRunStatus'
        steps:
          type: [integer, 'null']
          description: 총 step 수

    AdminRoundSummary:
      type: object
      required: [runId, projectTitle, taskGoal, mode, round, status, personaRuns]
      properties:
        runId:
          type: integer
          format: int64
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        mode:
          $ref: '#/components/schemas/Mode'
        round:
          type: integer
        status:
          $ref: '#/components/schemas/RunStatus'
        personaRuns:
          type: array
          description: Persona별 실행 결과 목록
          items:
            $ref: '#/components/schemas/PersonaRunResult'

    StepLog:
      type: object
      description: steps.jsonl의 한 줄(한 step). 행동 로그 스키마는 미정이며, 필드는 FE-BE 설계 문서 기준이다.
      required: [step, ts, url, reasoning, action, result, blocked]
      properties:
        step:
          type: integer
          description: step 번호
        ts:
          type: string
          format: date-time
          description: 기록 시각
        url:
          type: string
          description: step 시점의 URL
        reasoning:
          type: string
          description: Persona Agent의 판단 내용
        action:
          description: 수행한 행동(click, type, scroll, back, done). 형식은 미정이다.
        result:
          description: 행동 결과. 형식은 미정이다.
        blocked:
          type: boolean
          description: 가드가 차단한 step이면 true

    # ───────── 진단 ─────────

    FindingSummary:
      type: object
      required: [findingId, taxonomy, severity, summary]
      properties:
        findingId:
          type: integer
          format: int64
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        severity:
          type: string
          description: 심각도. 값과 산정 기준은 미정이다(GACA-68).
        summary:
          type: [string, 'null']
          description: 진단 요약

    FindingListResponse:
      type: object
      required: [firstRunId, round, projectTitle, taskGoal, improvementCount, findings]
      properties:
        firstRunId:
          type: integer
          format: int64
          description: 회차가 속한 실험의 식별자
        round:
          type: integer
          description: 몇 번째 회차인지
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        improvementCount:
          type: integer
          description: 이 회차의 개선안 수. '개선안 확인' 버튼을 켤지 정하는 데 쓴다.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/FindingSummary'

    FindingEvidence:
      type: object
      description: 진단의 근거 위치. 로그 원문은 파일에 있으므로 위치만 담는다. 필드 이름(stepFrom, stepTo)은 가칭이다.
      required: [personaId, stepFrom, stepTo, url]
      properties:
        personaId:
          type: integer
          format: int64
        stepFrom:
          type: integer
          description: 근거 step 구간의 시작
        stepTo:
          type: integer
          description: 근거 step 구간의 끝
        url:
          type: string
          description: 진단이 나온 URL

    FindingDetail:
      type: object
      required: [findingId, runId, taxonomy, severity, summary, evidence]
      properties:
        findingId:
          type: integer
          format: int64
        runId:
          type: integer
          format: int64
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        severity:
          type: string
          description: 심각도. 값과 산정 기준은 미정이다(GACA-68).
        summary:
          type: [string, 'null']
          description: 진단 요약
        evidence:
          $ref: '#/components/schemas/FindingEvidence'

    TaxonomyCount:
      type: object
      required: [taxonomy, count]
      properties:
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        count:
          type: integer
          description: 진단 수

    # ───────── 개선안, 다음 회차 ─────────

    ImprovementSummary:
      type: object
      required: [improvementId, optionNo, patchKind, fixCost, decision]
      properties:
        improvementId:
          type: integer
          format: int64
        optionNo:
          type: integer
          minimum: 1
          maximum: 3
          description: 몇 번째 안인지
        patchKind:
          $ref: '#/components/schemas/PatchKind'
        fixCost:
          type: [string, 'null']
          description: 구현 비용 추정
        decision:
          description: 결정. 결정 전이면 null이다.
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'

    ImprovementListResponse:
      type: object
      required: [firstRunId, round, projectTitle, taskGoal, awaitingApproval, improvements]
      properties:
        firstRunId:
          type: integer
          format: int64
          description: 회차가 속한 실험의 식별자
        round:
          type: integer
          description: 몇 번째 회차인지
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        awaitingApproval:
          type: boolean
          description: 이 회차가 다음 회차 승인을 기다리는 중이면 true. 회차 단위 값이라 목록과 상세에 모두 싣는다.
        improvements:
          type: array
          items:
            $ref: '#/components/schemas/ImprovementSummary'

    ImprovementDetail:
      type: object
      required: [improvementId, runId, optionNo, patchKind, patch, rationale, expectedEffect, fixCost, findings, decision, note, decidedAt, awaitingApproval]
      properties:
        improvementId:
          type: integer
          format: int64
        runId:
          type: integer
          format: int64
          description: 개선안을 산출한 회차
        optionNo:
          type: integer
          minimum: 1
          maximum: 3
          description: 몇 번째 안인지
        patchKind:
          $ref: '#/components/schemas/PatchKind'
        patch:
          type: object
          additionalProperties: true
          description: 패치 종류별 파라미터. 예를 들어 라벨 변경이면 대상 요소와 새 문구이다. 종류별 구조는 미정이다.
        rationale:
          type: [string, 'null']
          description: 근거
        expectedEffect:
          type: [string, 'null']
          description: 예상 효과
        fixCost:
          type: [string, 'null']
          description: 구현 비용 추정
        findings:
          type: array
          description: 이 개선안이 다루는 진단 목록. improvements.finding_ids에 담긴 진단 중 개선안과 같은 회차의 진단만 담는다.
          items:
            $ref: '#/components/schemas/FindingSummary'
        decision:
          description: 결정. 결정 전이면 null이다.
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        note:
          type: [string, 'null']
          description: 결정 사유. 결정 전이면 null이다.
        decidedAt:
          type: [string, 'null']
          format: date-time
          description: 결정 시각. 결정 전이면 null이다.
        awaitingApproval:
          type: boolean
          description: 이 회차가 다음 회차 승인을 기다리는 중이면 true

    ApprovalCreateRequest:
      type: object
      required: [improvementId, decision]
      properties:
        improvementId:
          type: integer
          format: int64
          description: 결정할 개선안. 경로의 회차에서 산출한 개선안이어야 한다.
        decision:
          $ref: '#/components/schemas/Decision'
        note:
          type: [string, 'null']
          description: 결정 사유

    ApprovalCreateResponse:
      type: object
      required: [approvalId, nextRunId]
      properties:
        approvalId:
          type: integer
          format: int64
        nextRunId:
          type: [integer, 'null']
          format: int64
          description: 승인이면 다음 회차의 runId, 반려면 null이다.

    # ───────── 결과 ─────────

    ScreenshotRef:
      type: object
      description: 결과 스크린샷 조회에 넘길 값. 어떤 스크린샷을 보여줄지의 선택 기준은 미결이다.
      required: [personaId, step]
      properties:
        personaId:
          type: integer
          format: int64
        step:
          type: integer

    ComparisonBefore:
      type: object
      required: [runId, metrics, screenshots]
      properties:
        runId:
          type: integer
          format: int64
          description: 최초 회차의 runId
        metrics:
          $ref: '#/components/schemas/RunMetrics'
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/ScreenshotRef'

    ComparisonAfter:
      type: object
      required: [runId, round, metrics, screenshots]
      properties:
        runId:
          type: integer
          format: int64
          description: 마지막 회차의 runId. status가 done인 회차 중 가장 최근 회차이다.
        round:
          type: integer
          description: 마지막 회차가 몇 번째 회차인지
        metrics:
          $ref: '#/components/schemas/RunMetrics'
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/ScreenshotRef'

    AppliedPatch:
      type: object
      description: 회차에 실제로 주입된 패치(patch_versions)
      required: [round, patchKind, applied]
      properties:
        round:
          type: integer
          description: 패치를 주입한 회차
        patchKind:
          $ref: '#/components/schemas/PatchKind'
        applied:
          type: boolean
          description: 주입 성공 여부

    ComparisonResponse:
      type: object
      required: [projectTitle, taskGoal, mode, state, before, after, patches]
      properties:
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        mode:
          $ref: '#/components/schemas/Mode'
        state:
          $ref: '#/components/schemas/ExperimentState'
        before:
          $ref: '#/components/schemas/ComparisonBefore'
        after:
          description: done인 회차가 하나뿐이면 null이다.
          anyOf:
            - $ref: '#/components/schemas/ComparisonAfter'
            - type: 'null'
        patches:
          type: array
          description: 회차별 적용 패치 목록
          items:
            $ref: '#/components/schemas/AppliedPatch'

    # ───────── 정책, 강제 중단, 감사 로그 ─────────

    Policy:
      type: object
      description: 전역 실행 한도. AI 모듈이 집행한다.
      required: [maxSteps, maxSeconds, maxTokens, runConcurrency, dailyTokenBudget]
      properties:
        maxSteps:
          type: integer
          description: Persona당 최대 step 수
        maxSeconds:
          type: integer
          description: Persona당 최대 시간(초)
        maxTokens:
          type: integer
          description: 회차당 토큰 상한
        runConcurrency:
          type: integer
          description: 동시 실험(회차) 수
        dailyTokenBudget:
          type: integer
          format: int64
          description: 일일 토큰 예산. 회차 스냅샷에 넣지 않고 매 LLM 호출 직전에 읽어 집행하므로, 수정하면 진행 중인 실험에도 적용된다.

    PolicyUpdateRequest:
      type: object
      description: 변경할 항목만 보낸다.
      properties:
        maxSteps:
          type: integer
        maxSeconds:
          type: integer
        maxTokens:
          type: integer
        runConcurrency:
          type: integer
        dailyTokenBudget:
          type: integer
          format: int64

    CancelAllResponse:
      type: object
      required: [cancelRequestedCount]
      properties:
        cancelRequestedCount:
          type: integer
          description: 취소 요청된 실험 수

    AuditLog:
      type: object
      required: [auditLogId, actor, action, target, detail, ts]
      properties:
        auditLogId:
          type: integer
          format: int64
        actor:
          type: string
          description: |-
            행위 주체. 사람이면 user:<id>, Agent면 agent:<run_id> 형식이다.
        action:
          type: string
          description: 행위 종류
        target:
          type: [string, 'null']
          description: 대상
        detail:
          type: [object, 'null']
          additionalProperties: true
          description: 부가 정보
        ts:
          type: string
          format: date-time
          description: 기록 시각

    AuditLogPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        page:
          $ref: '#/components/schemas/PageMetadata'
