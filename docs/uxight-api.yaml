        fieldErrors: []
    ACC-ERR-001:
      value:
        code: ACC-ERR-001
        message: 계정을 찾을 수 없습니다.
        fieldErrors: []
    ACC-ERR-002:
      value:
        code: ACC-ERR-002
        message: 마지막 관리자의 역할은 변경할 수 없습니다.
        fieldErrors: []

  responses:
    BadRequest:
      description: |-
        - GLB-ERR-001: 본문 형식 오류, 파라미터 타입 불일치
        - GLB-ERR-002: 입력값 검증 실패. 항목별 사유는 fieldErrors에 담는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            GLB-ERR-001:
              $ref: '#/components/examples/GLB-ERR-001'
            GLB-ERR-002:
              $ref: '#/components/examples/GLB-ERR-002'
    Unauthorized:
      description: |-
        - AUT-ERR-001: access 토큰이 없거나 만료, 위조됨
        - AUT-ERR-005: 비활성 계정
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            AUT-ERR-001:
              $ref: '#/components/examples/AUT-ERR-001'
            AUT-ERR-005:
              $ref: '#/components/examples/AUT-ERR-005'
    Forbidden:
      description: 'AUT-ERR-006: 관리자가 아님(리서처의 관리자 API 호출)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            AUT-ERR-006:
              $ref: '#/components/examples/AUT-ERR-006'
    ProjectNotFound:
      description: 'PRJ-ERR-001: 프로젝트가 없거나 본인 소유가 아님'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            PRJ-ERR-001:
              $ref: '#/components/examples/PRJ-ERR-001'
    ExperimentNotFound:
      description: |-
        EXP-ERR-001: 실험이 없음. 리서처 API에서는 본인 소유가 아닌 실험도 같은 코드로 응답한다.
        최초 회차가 아닌 runId도 실험이 없는 것으로 본다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EXP-ERR-001:
              $ref: '#/components/examples/EXP-ERR-001'
    RoundNotFound:
      description: 'EXP-ERR-002: 회차가 없거나 본인 소유가 아님, 또는 회차가 done이 아님'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EXP-ERR-002:
              $ref: '#/components/examples/EXP-ERR-002'
    FindingNotFound:
      description: 'FND-ERR-001: 진단이 없거나 본인 소유가 아님, 또는 진단의 회차가 done이 아님'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            FND-ERR-001:
              $ref: '#/components/examples/FND-ERR-001'
    ImprovementNotFound:
      description: 'IMP-ERR-001: 개선안이 없거나 본인 소유가 아님, 또는 개선안의 회차가 done이 아님'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            IMP-ERR-001:
              $ref: '#/components/examples/IMP-ERR-001'
    UserNotFound:
      description: 'ACC-ERR-001: 계정이 없음'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ACC-ERR-001:
              $ref: '#/components/examples/ACC-ERR-001'

  schemas:

    # ───────── 공통 ─────────

    ErrorResponse:
      type: object
      description: 모든 API의 공통 실패 응답 본문
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          description: 오류 코드. 값과 의미는 '오류 코드 및 오류 파일 설계'(8.4)의 표를 따른다.
          enum:
            - GLB-ERR-001
            - GLB-ERR-002
            - GLB-ERR-003
            - GLB-ERR-004
            - GLB-ERR-005
            - AUT-ERR-001
            - AUT-ERR-002
            - AUT-ERR-003
            - AUT-ERR-004
            - AUT-ERR-005
            - AUT-ERR-006
            - AUT-ERR-007
            - AUT-ERR-008
            - PRJ-ERR-001
            - PRJ-ERR-002
            - PRJ-ERR-003
            - EXP-ERR-001
            - EXP-ERR-002
            - EXP-ERR-003
            - EXP-ERR-004
            - EXP-ERR-005
            - EXP-ERR-006
            - EXP-ERR-007
            - EXP-ERR-008
            - LOG-ERR-001
            - LOG-ERR-002
            - FND-ERR-001
            - IMP-ERR-001
            - IMP-ERR-002
            - CMP-ERR-001
            - ACC-ERR-001
            - ACC-ERR-002
        message:
          type: string
          description: 오류 메시지
        fieldErrors:
          type: array
          description: 항목별 검증 오류 목록. GLB-ERR-002일 때만 내용이 있고, 그 밖에는 빈 목록이다.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 오류가 난 필드 이름
        message:
          type: string
          description: 오류 메시지

    PageInfo:
      type: object
      description: 페이지 정보. 목록(content)과 같은 단계에 담는다.
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          description: 현재 페이지 번호. 0부터 시작한다.
        size:
          type: integer
          description: 페이지 크기
        totalElements:
          type: integer
          format: int64
          description: 전체 항목 수
        totalPages:
          type: integer
          description: 전체 페이지 수

    # ───────── 코드값 ─────────

    Role:
      type: string
      enum: [admin, researcher]
      description: 계정 역할. admin(관리자), researcher(리서처)

    AuthProvider:
      type: string
      enum: [local, google]
      description: 가입 방식. local(이메일 가입), google(Google 가입)

    Mode:
      type: string
      enum: [diagnose, improve, loop]
      description: |-
        회차가 파이프라인을 어디까지 진행하는지 정한다. 실험 요청 시 정하고 이후 바꾸지 않는다.
        - diagnose: 1회차 진단까지
        - improve: 1회차 개선안까지. 다음 회차 없음
        - loop: 개선안, 다음 회차 승인, 다음 회차를 loopMax까지 반복

    RunStatus:
      type: string
      enum: [queued, accepted, running, done, failed, cancelled]
      description: |-
        회차 상태(runs.status). accepted는 실행 시작이 아니라 접수이며, 동시 실행 한도가 차 있으면 accepted로 자리를 기다린다.
        done은 mode의 마지막 단계(diagnose는 진단, improve와 loop는 개선안)가 끝난 상태이다.

    ExperimentState:
      type: string
      enum: [in_progress, awaiting_approval, completed, stopped]
      description: |-
        실험 분류. 마지막 회차의 status, 취소 요청, 그 회차의 개선안과 승인 기록으로 정하며 네 분류는 겹치지 않는다. 분류 기준은 design-decision.md 2.6을 따른다.
        - in_progress: 진행 중
        - awaiting_approval: 승인 대기
        - completed: 완료됨
        - stopped: 중단

    EndType:
      type: string
      enum: [cancelling, cancelled, failed]
      description: |-
        중단의 종료 유형. 마지막 회차의 status로 정한다.
        - cancelling: 취소 진행 중. status가 queued, accepted, running
        - cancelled: 취소. status가 cancelled 또는 done
        - failed: 실패. status가 failed

    PersonaRunStatus:
      type: string
      enum: [running, done, max_steps, fail, timeout, cancelled]
      description: Persona 실행 상태(run_personas.status). done이면 성공이다(메인 판정 기준).

    Taxonomy:
      type: string
      enum: [navigation_confusion, interaction_failure, task_failure, excessive_steps]
      description: |-
        Friction 유형. 전체 7종 중 4종 우선 구현이며 코드값은 가칭이다.
        - navigation_confusion: Navigation Confusion
        - interaction_failure: Interaction Failure
        - task_failure: Task Failure
        - excessive_steps: Excessive Steps

    PatchKind:
      type: string
      enum: [relabel, move, highlight, help_text]
      description: |-
        패치 종류. 코드값은 가칭이다.
        - relabel: 라벨 변경
        - move: 요소 이동
        - highlight: 요소 강조
        - help_text: 도움말 삽입

    Decision:
      type: string
      enum: [approve, reject]
      description: 다음 회차 진행에 대한 결정. approve(승인), reject(반려)

    # ───────── 인증, 계정 ─────────

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 이메일(로그인 ID)
        password:
          type: string
          format: password
        name:
          type: string
          maxLength: 100
          description: 표시 이름

    SignupResponse:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64
          description: 생성된 계정 ID

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: 이메일(로그인 ID)
        password:
          type: string
          format: password

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google이 프론트엔드에 발급한 ID 토큰

    TokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: access 토큰(JWT)

    UserMe:
      type: object
      required: [userId, name, role]
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: [string, 'null']
          description: 표시 이름
        role:
          $ref: '#/components/schemas/Role'

    AdminUser:
      type: object
      required: [userId, email, name, role, authProvider, isActive, createdAt]
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: [string, 'null']
          description: 표시 이름
        role:
          $ref: '#/components/schemas/Role'
        authProvider:
          $ref: '#/components/schemas/AuthProvider'
        isActive:
          type: boolean
          description: 계정 활성 여부
        createdAt:
          type: string
          format: date-time
          description: 가입 일시

    AdminUserPage:
      description: 계정 목록 페이지
      allOf:
        - type: object
          required: [content]
          properties:
            content:
              type: array
              description: 계정 목록
              items:
                $ref: '#/components/schemas/AdminUser'
        - $ref: '#/components/schemas/PageInfo'

    RoleChangeRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    RoleChangeResponse:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/Role'

    # ───────── 프로젝트, Persona, 테스트 계정 ─────────

    ProjectSummary:
      type: object
      required: [projectId, title, targetUrl, description]
      properties:
        projectId:
          type: integer
          format: int64
        title:
          type: string
          description: 제목
        targetUrl:
          type: string
          description: 대상 URL(시작 URL)
        description:
          type: [string, 'null']
          description: 설명

    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          description: 본인 프로젝트 목록
          items:
            $ref: '#/components/schemas/ProjectSummary'

    ProjectDetail:
      type: object
      required: [projectId, title, targetUrl, description, allowedDomains]
      properties:
        projectId:
          type: integer
          format: int64
        title:
          type: string
          description: 제목
        targetUrl:
          type: string
          description: 대상 URL(시작 URL)
        description:
          type: [string, 'null']
          description: 설명
        allowedDomains:
          type: array
          items:
            type: string
          description: 허용 도메인 목록. Agent가 이 목록 밖 도메인으로 나가려 하면 차단하고 blocked step으로 기록한다.

    ProjectCreateRequest:
      type: object
      required: [title, targetUrl, allowedDomains]
      properties:
        title:
          type: string
          maxLength: 100
        targetUrl:
          type: string
          format: uri
          maxLength: 2048
        description:
          type: [string, 'null']
          description: 설명. 길이 상한은 애플리케이션에서 정한다(미정).
        allowedDomains:
          type: array
          items:
            type: string
          description: 허용 도메인 목록

    ProjectCreateResponse:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: integer
          format: int64

    ProjectUpdateRequest:
      type: object
      description: 변경할 항목만 보낸다.
      properties:
        title:
          type: string
          maxLength: 100
        targetUrl:
          type: string
          format: uri
          maxLength: 2048
        description:
          type: [string, 'null']
        allowedDomains:
          type: array
          items:
            type: string

    Persona:
      type: object
      required: [personaId, name, profile, isCommon]
      properties:
        personaId:
          type: integer
          format: int64
        name:
          type: string
          description: 표시 이름
        profile:
          type: object
          additionalProperties: true
          description: |-
            속성 묶음(웹 숙련도, 사용 기기, 도메인 지식, 배경). 키는 camelCase를 쓴다.
            domainKnowledge는 대상 사이트 분야에 대한 상대적 수준(low, mid, high)이며, 나머지 속성의 데이터 형식은 미정이다(GACA-66).
          examples:
            - webSkill: low
              device: mobile
              domainKnowledge: low
              background: 온라인 쇼핑 경험이 적음
        isCommon:
          type: boolean
          description: 관리자 소유의 공용 Persona이면 true

    PersonaListResponse:
      type: object
      required: [personas]
      properties:
        personas:
          type: array
          description: 본인 소유 Persona와 공용 Persona 목록
          items:
            $ref: '#/components/schemas/Persona'

    TestAccountCreateRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          maxLength: 255
          description: 테스트 계정 아이디
        password:
          type: string
          format: password
          description: 테스트 계정 비밀번호. Spring이 암호화해 저장한다.

    TestAccountCreateResponse:
      type: object
      required: [testAccountId]
      properties:
        testAccountId:
          type: integer
          format: int64

    TestAccount:
      type: object
      required: [testAccountId, loginId, createdAt]
      properties:
        testAccountId:
          type: integer
          format: int64
        loginId:
          type: string
          description: 테스트 계정 아이디
        createdAt:
          type: string
          format: date-time
          description: 등록 일시

    TestAccountListResponse:
      type: object
      required: [testAccounts]
      properties:
        testAccounts:
          type: array
          description: 테스트 계정 목록
          items:
            $ref: '#/components/schemas/TestAccount'

    # ───────── 실험, 회차 ─────────

    ExperimentCreateRequest:
      type: object
      required: [goal, successUrl, personaIds, mode]
      properties:
        goal:
          type: string
          maxLength: 200
          description: Task 목표
        successUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 성공 URL. Task 성공 판정의 보조 기준이다.
        personaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
          description: 선택한 Persona ID 목록. 본인 소유 Persona와 공용 Persona만 선택할 수 있다.
        mode:
          $ref: '#/components/schemas/Mode'
        loopMax:
          type: [integer, 'null']
          minimum: 1
          description: 최초 회차를 포함한 최대 회차 수. mode가 loop일 때 필수이다.

    ExperimentCreateResponse:
      type: object
      required: [runId]
      properties:
        runId:
          type: integer
          format: int64
          description: 최초 회차의 runId. 실험의 firstRunId와 같다.

    ExperimentSummary:
      type: object
      description: 실험 목록의 항목. runId, round, status, progress는 실험의 마지막 회차 기준이다.
      required: [firstRunId, runId, round, status, state, endType, stale, hasResult, projectTitle, taskGoal, mode, progress, personaCount, elapsedSeconds, createdAt]
      properties:
        firstRunId:
          type: integer
          format: int64
          description: 실험 식별자(최초 회차의 runId)
        runId:
          type: integer
          format: int64
          description: 마지막 회차의 runId
        round:
          type: integer
          description: 마지막 회차가 몇 번째 회차인지
        status:
          $ref: '#/components/schemas/RunStatus'
          description: 마지막 회차의 status
        state:
          $ref: '#/components/schemas/ExperimentState'
        endType:
          description: state가 stopped일 때만 값이 있고, 그 밖에는 null이다.
          anyOf:
            - $ref: '#/components/schemas/EndType'
            - type: 'null'
        stale:
          type: boolean
          description: 마지막 회차의 status가 running이고 heartbeat_at 이후 임계 시간이 지났으면 true. 표시만 하며 자동으로 failed로 바꾸지 않는다.
        hasResult:
          type: boolean
          description: 최초 회차가 done이면 true. 결과 버튼 활성화에 쓴다.
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        mode:
          $ref: '#/components/schemas/Mode'
        progress:
          type: [integer, 'null']
          description: 마지막 회차의 완료 Persona 수
        personaCount:
          type: integer
          description: 실험에 투입한 Persona 수
        elapsedSeconds:
          type: integer
          format: int64
          description: 전체 회차의 소요 시간 합(초)
        createdAt:
          type: string
          format: date-time
          description: 실험 요청 시각

    ExperimentPage:
      description: 실험 목록 페이지
      allOf:
        - type: object
          required: [content]
          properties:
            content:
              type: array
              description: 실험 목록. 최근 요청 순이다.
              items:
                $ref: '#/components/schemas/ExperimentSummary'
        - $ref: '#/components/schemas/PageInfo'

    ExperimentStats:
      type: object
      required: [totalCount, inProgressCount, completedCount, completedThisWeekCount, awaitingApprovalCount, totalTokens, thisWeekFrom]
      properties:
        totalCount:
          type: integer
          description: 총 실험 건수. 네 분류는 겹치지 않으므로 네 분류 건수의 합과 같다.
        inProgressCount:
          type: integer
          description: 진행 중인 실험 건수
        completedCount:
          type: integer
          description: 완료된 실험 건수
        completedThisWeekCount:
          type: integer
          description: 이번 주 완료된 실험 건수. 완료 시각이 thisWeekFrom 이후인 완료된 실험이다.
        awaitingApprovalCount:
          type: integer
          description: 승인 대기 중인 실험 수
        totalTokens:
          type: integer
          format: int64
          description: 총 소요 토큰
        thisWeekFrom:
          type: string
          format: date-time
          description: 이번 주의 시작 시각. '이번 주 완료'로 이동할 때 GET /api/runs의 finishedFrom으로 넘긴다. '이번 주'의 기준(시작 요일, 시간대)은 미결이다.

    RunMetrics:
      type: object
      description: 회차 종료 시 확정된 지표(run_metrics). 회차 목록과 결과 조회가 같은 구성을 쓴다.
      required: [successRate, avgSteps, avgBacktracks, avgSeconds, tokens, costUsd]
      properties:
        successRate:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: 성공 Persona(Persona 실행 status가 done) 비율. 0 이상 100 이하
        avgSteps:
          type: [number, 'null']
          description: 평균 step 수
        avgBacktracks:
          type: [number, 'null']
          description: 평균 뒤로가기 횟수
        avgSeconds:
          type: [number, 'null']
          description: 평균 소요 시간(초)
        tokens:
          type: [integer, 'null']
          format: int64
          description: 토큰
        costUsd:
          type: [number, 'null']
          description: 비용(USD)

    RoundSummary:
      type: object
      required: [runId, round, status, appliedImprovementId, createdAt, finishedAt, metrics]
      properties:
        runId:
          type: integer
          format: int64
        round:
          type: integer
          description: 몇 번째 회차인지
        status:
          $ref: '#/components/schemas/RunStatus'
        appliedImprovementId:
          type: [integer, 'null']
          format: int64
          description: 이 회차를 만든 승인 개선안. 최초 회차는 null이다.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        metrics:
          description: 회차의 지표. 확정된 지표가 없으면 null이다.
          anyOf:
            - $ref: '#/components/schemas/RunMetrics'
            - type: 'null'

    RoundListResponse:
      type: object
      required: [rounds, awaitingApproval]
      properties:
        rounds:
          type: array
          description: 회차 목록
          items:
            $ref: '#/components/schemas/RoundSummary'
        awaitingApproval:
          type: boolean
          description: 실험이 승인 대기 중이면 true

    AdminExperimentSummary:
      type: object
      description: 전체 실험 목록의 항목. round, status, finishedAt은 실험의 마지막 회차 기준이다.
      required: [firstRunId, projectTitle, ownerEmail, taskGoal, mode, round, status, createdAt, finishedAt]
      properties:
        firstRunId:
          type: integer
          format: int64
        projectTitle:
          type: string
        ownerEmail:
          type: string
          description: 프로젝트 소유 리서처의 이메일
        taskGoal:
          type: string
          description: Task 목표
        mode:
          $ref: '#/components/schemas/Mode'
        round:
          type: integer
        status:
          $ref: '#/components/schemas/RunStatus'
        createdAt:
          type: string
          format: date-time
          description: 실험 요청 시각
        finishedAt:
          type: [string, 'null']
          format: date-time

    AdminExperimentPage:
      description: 전체 실험 목록 페이지
      allOf:
        - type: object
          required: [content]
          properties:
            content:
              type: array
              description: 실험 목록
              items:
                $ref: '#/components/schemas/AdminExperimentSummary'
        - $ref: '#/components/schemas/PageInfo'

    PersonaRunResult:
      type: object
      description: Persona 실행 결과(run_personas 한 행)
      required: [personaId, name, status, steps]
      properties:
        personaId:
          type: integer
          format: int64
        name:
          type: string
          description: Persona 표시 이름
        status:
          $ref: '#/components/schemas/PersonaRunStatus'
        steps:
          type: [integer, 'null']
          description: 총 step 수

    AdminRoundSummary:
      type: object
      required: [runId, projectTitle, taskGoal, mode, round, status, personas]
      properties:
        runId:
          type: integer
          format: int64
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        mode:
          $ref: '#/components/schemas/Mode'
        round:
          type: integer
        status:
          $ref: '#/components/schemas/RunStatus'
        personas:
          type: array
          description: Persona별 실행 결과 목록
          items:
            $ref: '#/components/schemas/PersonaRunResult'

    AdminRoundListResponse:
      type: object
      required: [rounds]
      properties:
        rounds:
          type: array
          description: 회차 목록
          items:
            $ref: '#/components/schemas/AdminRoundSummary'

    StepLog:
      type: object
      description: steps.jsonl의 한 줄(한 step). 행동 로그 스키마는 미정이다.
      required: [step, ts, url, reasoning, action, result, blocked]
      properties:
        step:
          type: integer
          description: step 번호
        ts:
          type: string
          format: date-time
          description: 기록 시각
        url:
          type: string
          description: 현재 페이지 URL
        reasoning:
          type: string
          description: Agent의 판단 근거
        action:
          type: string
          description: "수행한 행동. 예: click #cart"
        result:
          type: string
          description: "행동 결과. 예: success"
        blocked:
          type: boolean
          description: 가드가 차단한 step이면 true

    StepLogListResponse:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          description: step 로그 목록
          items:
            $ref: '#/components/schemas/StepLog'

    # ───────── 진단 ─────────

    FindingSummary:
      type: object
      required: [findingId, taxonomy, severity, summary]
      properties:
        findingId:
          type: integer
          format: int64
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        severity:
          type: string
          description: 심각도. 값과 산정 기준은 미정이다(GACA-68).
        summary:
          type: [string, 'null']
          description: 진단 요약

    FindingRoundInfo:
      type: object
      description: 회차 정보. 메뉴로 다시 들어온 화면을 runId 하나로 다시 그리는 데 쓴다.
      required: [firstRunId, round, projectTitle, taskGoal, improvementCount]
      properties:
        firstRunId:
          type: integer
          format: int64
          description: 회차가 속한 실험의 식별자
        round:
          type: integer
          description: 몇 번째 회차인지
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        improvementCount:
          type: integer
          description: 이 회차의 개선안 수. '개선안 확인' 버튼을 켤지 정하는 데 쓴다.

    FindingListResponse:
      type: object
      required: [run, findings]
      properties:
        run:
          $ref: '#/components/schemas/FindingRoundInfo'
        findings:
          type: array
          description: 진단 목록
          items:
            $ref: '#/components/schemas/FindingSummary'

    FindingEvidence:
      type: object
      description: 근거 위치 하나. 로그 원문은 파일에 있으므로 위치만 담는다.
      required: [personaId, stepFrom, stepTo, url]
      properties:
        personaId:
          type: integer
          format: int64
        stepFrom:
          type: integer
          description: 근거 step 구간의 시작
        stepTo:
          type: integer
          description: 근거 step 구간의 끝
        url:
          type: string
          description: 진단이 나온 URL

    FindingDetail:
      type: object
      required: [findingId, runId, taxonomy, severity, summary, evidence]
      properties:
        findingId:
          type: integer
          format: int64
        runId:
          type: integer
          format: int64
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        severity:
          type: string
          description: 심각도. 값과 산정 기준은 미정이다(GACA-68).
        summary:
          type: [string, 'null']
          description: 진단 요약
        evidence:
          type: array
          description: 근거 목록
          items:
            $ref: '#/components/schemas/FindingEvidence'

    TaxonomyCount:
      type: object
      required: [taxonomy, count]
      properties:
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        count:
          type: integer
          description: 진단 수

    TaxonomyStatsResponse:
      type: object
      required: [stats]
      properties:
        stats:
          type: array
          description: Taxonomy별 진단 수 목록
          items:
            $ref: '#/components/schemas/TaxonomyCount'

    # ───────── 개선안, 다음 회차 ─────────

    ImprovementSummary:
      type: object
      required: [improvementId, optionNo, patchKind, fixCost, decision]
      properties:
        improvementId:
          type: integer
          format: int64
        optionNo:
          type: integer
          minimum: 1
          maximum: 3
          description: 몇 번째 안인지
        patchKind:
          $ref: '#/components/schemas/PatchKind'
        fixCost:
          type: [string, 'null']
          description: 구현 비용 추정
        decision:
          description: 결정. 결정 전이면 null이다.
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'

    ImprovementRoundInfo:
      type: object
      description: 회차 정보. 메뉴로 다시 들어온 화면을 runId 하나로 다시 그리는 데 쓴다.
      required: [firstRunId, round, projectTitle, taskGoal, awaitingApproval]
      properties:
        firstRunId:
          type: integer
          format: int64
          description: 회차가 속한 실험의 식별자
        round:
          type: integer
          description: 몇 번째 회차인지
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        awaitingApproval:
          type: boolean
          description: 이 회차가 다음 회차 승인을 기다리는 중이면 true. 회차 단위 값이라 목록과 상세에 모두 싣는다.

    ImprovementListResponse:
      type: object
      required: [run, improvements]
      properties:
        run:
          $ref: '#/components/schemas/ImprovementRoundInfo'
        improvements:
          type: array
          description: 개선안 목록
          items:
            $ref: '#/components/schemas/ImprovementSummary'

    ImprovementApproval:
      type: object
      description: 개선안에 대한 결정
      required: [decision, note, decidedAt]
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        note:
          type: [string, 'null']
          description: 결정 사유
        decidedAt:
          type: string
          format: date-time
          description: 결정 시각

    ImprovementDetail:
      type: object
      required: [improvementId, runId, optionNo, patchKind, patch, rationale, expectedEffect, fixCost, findings, approval, awaitingApproval]
      properties:
        improvementId:
          type: integer
          format: int64
        runId:
          type: integer
          format: int64
          description: 개선안을 산출한 회차
        optionNo:
          type: integer
          minimum: 1
          maximum: 3
          description: 몇 번째 안인지
        patchKind:
          $ref: '#/components/schemas/PatchKind'
        patch:
          type: object
          additionalProperties: true
          description: 패치 종류별 파라미터. 예를 들어 라벨 변경이면 대상 요소와 새 문구이다. 종류별 구조는 미정이다.
          examples:
            - target: '#checkout-btn'
              style: primary
        rationale:
          type: [string, 'null']
          description: 근거
        expectedEffect:
          type: [string, 'null']
          description: 예상 효과
        fixCost:
          type: [string, 'null']
          description: 구현 비용 추정
        findings:
          type: array
          description: 이 개선안이 다루는 진단 목록. improvements.finding_ids에 담긴 진단 중 개선안과 같은 회차의 진단만 담는다.
          items:
            $ref: '#/components/schemas/FindingSummary'
        approval:
          description: 결정. 결정 전이면 null이다.
          anyOf:
            - $ref: '#/components/schemas/ImprovementApproval'
            - type: 'null'
        awaitingApproval:
          type: boolean
          description: 이 회차가 다음 회차 승인을 기다리는 중이면 true

    ApprovalCreateRequest:
      type: object
      required: [improvementId, decision]
      properties:
        improvementId:
          type: integer
          format: int64
          description: 결정할 개선안. 경로의 회차에서 산출한 개선안이어야 한다.
        decision:
          $ref: '#/components/schemas/Decision'
        note:
          type: [string, 'null']
          description: 결정 사유

    ApprovalCreateResponse:
      type: object
      required: [approvalId, runId]
      properties:
        approvalId:
          type: integer
          format: int64
          description: 생성된 결정 ID
        runId:
          type: [integer, 'null']
          format: int64
          description: 다음 회차 ID. 승인이면 새로 만든 다음 회차의 runId, 반려면 null이다. 경로의 runId(결정한 회차)와 다른 회차이다.

    # ───────── 결과 ─────────

    ScreenshotRef:
      type: object
      description: 결과 스크린샷 조회에 넘길 값. 어떤 스크린샷을 보여줄지의 선택 기준은 미결이다.
      required: [personaId, step]
      properties:
        personaId:
          type: integer
          format: int64
        step:
          type: integer

    ComparisonExperiment:
      type: object
      description: 실험 정보
      required: [projectTitle, taskGoal, mode, state]
      properties:
        projectTitle:
          type: string
        taskGoal:
          type: string
          description: Task 목표
        mode:
          $ref: '#/components/schemas/Mode'
        state:
          $ref: '#/components/schemas/ExperimentState'

    ComparisonBefore:
      type: object
      required: [runId, metrics, screenshots]
      properties:
        runId:
          type: integer
          format: int64
          description: 최초 회차의 runId
        metrics:
          $ref: '#/components/schemas/RunMetrics'
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/ScreenshotRef'

    ComparisonAfter:
      type: object
      required: [runId, round, metrics, screenshots]
      properties:
        runId:
          type: integer
          format: int64
          description: 마지막 회차의 runId. status가 done인 회차 중 가장 최근 회차이다.
        round:
          type: integer
          description: 마지막 회차가 몇 번째 회차인지
        metrics:
          $ref: '#/components/schemas/RunMetrics'
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/ScreenshotRef'

    AppliedPatch:
      type: object
      description: 회차에 실제로 주입된 패치(patch_versions)
      required: [round, patchKind, applied]
      properties:
        round:
          type: integer
          description: 패치를 주입한 회차
        patchKind:
          $ref: '#/components/schemas/PatchKind'
        applied:
          type: boolean
          description: 주입 성공 여부

    ComparisonResponse:
      type: object
      required: [experiment, before, after, patches]
      properties:
        experiment:
          $ref: '#/components/schemas/ComparisonExperiment'
        before:
          $ref: '#/components/schemas/ComparisonBefore'
        after:
          description: done인 회차가 하나뿐이면 null이다.
          anyOf:
            - $ref: '#/components/schemas/ComparisonAfter'
            - type: 'null'
        patches:
          type: array
          description: 회차별 적용 패치 목록
          items:
            $ref: '#/components/schemas/AppliedPatch'

    # ───────── 정책, 강제 중단, 감사 로그 ─────────

    Policy:
      type: object
      description: 전역 실행 한도. AI 모듈이 집행한다.
      required: [maxSteps, maxSeconds, maxTokens, runConcurrency, dailyTokenBudget]
      properties:
        maxSteps:
          type: integer
          description: Persona당 최대 step 수
        maxSeconds:
          type: integer
          description: Persona당 최대 시간(초)
        maxTokens:
          type: integer
          description: 회차당 토큰 상한
        runConcurrency:
          type: integer
          description: 동시 실험(회차) 수
        dailyTokenBudget:
          type: integer
          format: int64
          description: 일일 토큰 예산. 회차 스냅샷에 넣지 않고 매 LLM 호출 직전에 읽어 집행하므로, 수정하면 진행 중인 실험에도 적용된다.

    PolicyUpdateRequest:
      type: object
      description: 변경할 항목만 보낸다.
      properties:
        maxSteps:
          type: integer
        maxSeconds:
          type: integer
        maxTokens:
          type: integer
        runConcurrency:
          type: integer
        dailyTokenBudget:
          type: integer
          format: int64

    CancelAllResponse:
      type: object
      required: [cancelledCount]
      properties:
        cancelledCount:
          type: integer
          description: 취소 요청된 실험 수. 실제 중단은 AI 모듈이 나중에 수행한다.

    AuditLog:
      type: object
      required: [auditLogId, actor, action, target, detail, ts]
      properties:
        auditLogId:
          type: integer
          format: int64
        actor:
          type: string
          description: |-
            행위 주체. 사람이면 user:<id>, Agent면 agent:<runId> 형식이다.
        action:
          type: string
          description: 행위 종류
        target:
          type: [string, 'null']
          description: 대상
        detail:
          type: [object, 'null']
          additionalProperties: true
          description: 부가 정보
        ts:
          type: string
          format: date-time
          description: 기록 시각

    AuditLogPage:
      description: 감사 로그 목록 페이지
      allOf:
        - type: object
          required: [content]
          properties:
            content:
              type: array
              description: 감사 로그 목록
              items:
                $ref: '#/components/schemas/AuditLog'
        - $ref: '#/components/schemas/PageInfo'
