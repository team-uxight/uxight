openapi: 3.0.3
info:
  title: UXight 내부 API (BE-AI)
  version: 0.1.0
  description: |
    백엔드(Spring)와 AI 모듈(FastAPI) 간 내부 REST API. 원본: "UXight REST API(BE-AI) 설계" 문서.
    호출 대상 서버가 API마다 달라서 servers를 경로별로 지정했다.

    ## 규칙
    - AI 모듈의 API는 Spring만 호출한다. Spring의 내부 API는 `/internal`로 시작하고, AI 모듈만 호출한다. 두 쪽 모두 프론트엔드는 호출하지 않는다.
    - 모든 내부 API는 공유 토큰 헤더(`X-Internal-Token: <공유 비밀값>`)를 보낸다. 받는 쪽은 자기 환경 변수의 값과 다르면 401을 응답한다.
    - AI 모듈의 실패 응답 본문은 FastAPI 기본 형식(detail)을 따른다. Spring은 이 본문을 프론트엔드에 전달하지 않고 로그에만 남긴다.
    - 회차 상태, 진행률, 결과(진단, 개선안, 지표)는 AI 모듈이 DB에 직접 쓴다. AI 모듈이 Spring에 상태를 보고하는 콜백 API는 없다.
    - 취소는 Spring이 runs 테이블의 cancel_requested 컬럼만 기록하고, AI 모듈이 step 경계에서 확인한다.
    - JSON 필드 이름은 snake_case를 사용한다.
security:
  - internalToken: []
tags:
  - name: AI 모듈 API
    description: Spring만 호출한다.
  - name: Spring 내부 API
    description: AI 모듈만 호출한다.

paths:
  # ───────── 0. 성공 기준 생성 ─────────
  /success-rules:
    servers:
      - url: http://localhost:8000
        description: AI 모듈(FastAPI)
    post:
      tags: [AI 모듈 API]
      summary: 성공 기준 생성
      description: |
        실험 요청 처리 중 Spring이 동기로 호출한다.
        AI 모듈은 DB에 쓰지 않고 성공 기준만 반환한다. tasks.success_rule 저장은 tasks의 쓰기 주인인 Spring이 한다.
        성공 기준은 화면 요소 기준이 아니라 도달 상태 기준으로 생성한다.
        Spring은 실패 응답을 받으면 502, 정해진 시간 안에 응답을 받지 못하면 504를 프론트엔드에 응답한다.
      operationId: createSuccessRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuccessRuleRequest" }
      responses:
        "200":
          description: 성공 기준 생성 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessRuleResponse" }
        "401": { $ref: "#/components/responses/FastApiUnauthorized" }
        "422": { $ref: "#/components/responses/FastApiValidationFailed" }
        "5XX":
          description: 성공 기준 생성 실패
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiError" }

  # ───────── 1. 실행 요청 ─────────
  /runs:
    servers:
      - url: http://localhost:8000
        description: AI 모듈(FastAPI)
    post:
      tags: [AI 모듈 API]
      summary: 회차 실행 요청
      description: |
        AI 모듈은 run_id로 runs 행의 스냅샷(대상 URL, Task, Persona, 정책)을 읽어 실행한다.
        Spring은 회차 INSERT를 커밋한 뒤에 호출한다. 실험 요청과 다음 회차 승인 모두 이 API로 회차를 전달한다.
        Spring은 queued로 남은 회차에 이 API를 다시 보낸다(재전송).

        AI 모듈은 'status가 queued일 때만 accepted로 바꾸는' UPDATE를 실행하고, 바뀐 행이 있으면 202, 없으면 200을 응답한다(멱등).
        202는 실행 시작이 아니라 접수를 뜻한다. 동시 실행 한도가 차 있으면 회차는 accepted 상태로 자리가 날 때까지 기다린다.

        Spring은 호출 결과를 dispatch_state(sent, unreachable, timeout)에만 기록하고 status는 바꾸지 않는다.
        200과 202 모두 sent로 기록한다.
      operationId: dispatchRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunDispatchRequest" }
      responses:
        "202":
          description: 회차 접수(status를 queued에서 accepted로 변경함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunAcceptedResponse" }
        "200":
          description: 이미 받은 회차(바뀐 행 없음)
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/RunAlreadyReceivedResponse" }
        "401": { $ref: "#/components/responses/FastApiUnauthorized" }
        "404":
          description: 회차가 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiError" }
        "422": { $ref: "#/components/responses/FastApiValidationFailed" }

  # ───────── 2. 자격증명 제공 ─────────
  /internal/runs/{runId}/credentials:
    servers:
      - url: http://localhost:8080
        description: Spring
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Spring 내부 API]
      summary: 테스트 계정 자격증명 제공
      description: |
        Persona Agent 루프 시작 전 로그인 스크립트에 사용한다.
        Spring은 test_accounts 테이블에서 assigned_run_id가 runId인 계정만 복호화해 제공한다.
        AI 모듈은 회차의 자격증명 전부를 status를 running으로 바꾸기 전에 한 번에 받는다.
        제공 횟수는 제한하지 않는다. AI 모듈이 재시작으로 accepted 회차를 다시 가져가면 다시 받을 수 있다.
      operationId: getRunCredentials
      responses:
        "200":
          description: 자격증명 목록. 테스트 계정이 없으면 빈 목록이며, AI 모듈은 로그인 단계를 건너뛴다.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Credential" }
        "401":
          description: 공유 토큰 불일치
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpringInternalError" }
        "404":
          description: 회차가 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpringInternalError" }
        "409":
          description: 회차가 accepted가 아니거나 취소 요청된 회차
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpringInternalError" }

components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Spring과 AI 모듈이 환경 변수로 같은 비밀값을 가진다.

  responses:
    FastApiUnauthorized:
      description: 공유 토큰 불일치
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FastApiError" }
    FastApiValidationFailed:
      description: 요청 본문 검증 실패(FastAPI 기본 동작). Spring은 실패 응답으로 처리한다.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FastApiValidationError" }

  schemas:
    # ───── 성공 기준 생성 ─────
    SuccessRuleRequest:
      type: object
      required: [target_url, goal, success_url]
      properties:
        target_url: { type: string, maxLength: 2048 }
        goal: { type: string, maxLength: 200 }
        success_url: { type: string, maxLength: 2048 }
    SuccessRuleResponse:
      type: object
      required: [success_rule]
      properties:
        success_rule:
          type: string
          description: 도달 상태 기준의 성공 기준.

    # ───── 실행 요청 ─────
    RunDispatchRequest:
      type: object
      required: [run_id]
      properties:
        run_id: { type: integer, format: int64 }
    RunAcceptedResponse:
      type: object
      required: [run_id]
      properties:
        run_id: { type: integer, format: int64 }
    RunAlreadyReceivedResponse:
      type: object
      required: [run_id, status]
      properties:
        run_id: { type: integer, format: int64 }
        status:
          type: string
          description: 회차의 현재 status
          enum: [accepted, running, done, failed, cancelled]

    # ───── 자격증명 제공 ─────
    Credential:
      type: object
      required: [test_account_id, login_id, password]
      properties:
        test_account_id: { type: integer, format: int64 }
        login_id: { type: string }
        password:
          type: string
          format: password
          description: 복호화된 평문. AI 모듈은 메모리에만 두고 LLM 프롬프트, 관측, 로그, 스크린샷 어디에도 남기지 않는다.

    # ───── 실패 응답 ─────
    FastApiError:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
    FastApiValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg: { type: string }
              type: { type: string }
    SpringInternalError:
      type: object
      required: [message]
      properties:
        message: { type: string }
