<text x="290.0" y="590" font-size="15" fill="#6B7686" text-anchor="middle">observe() · act() · 로그</text>
<text x="290.0" y="610" font-size="15" fill="#6B7686" text-anchor="middle">WebDriver — Playwright (지금)</text>
<text x="290.0" y="630" font-size="15" fill="#6B7686" text-anchor="middle">AppDriver — Appium (Phase 2)</text>
