<text x="620.0" y="610" font-size="15" fill="#6B7686" text-anchor="middle">정리된 DOM → 다음 행동 결정</text>
<text x="620.0" y="630" font-size="15" fill="#6B7686" text-anchor="middle">click / type / scroll / back</text>
