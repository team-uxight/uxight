<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" font-family='"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif'><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2330"/></marker></defs><rect width="1600" height="820" fill="#FFFFFF"/>
<text x="60" y="48" font-size="24" font-weight="700" fill="#1B2330">시스템 구성도</text>
<text x="60" y="72" font-size="13" fill="#6B7686">클라이언트 → API 서버 → Agent Runner(브라우저 · LLM). Driver 추상화로 웹 지금 / 앱 확장.</text>
<rect x="60" y="100" width="1480" height="170" rx="10" fill="#EEF3F8"/>
