<text x="290.0" y="566" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">Driver 추상화</text>
<text x="290.0" y="590" font-size="15" fill="#6B7686" text-anchor="middle">observe() · act() · 로그</text>
<text x="290.0" y="610" font-size="15" fill="#6B7686" text-anchor="middle">WebDriver — Playwright</text>
<text x="290.0" y="630" font-size="15" fill="#6B7686" text-anchor="middle">임의 URL 대응</text>
<rect x="470" y="540" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#1F5F8B" stroke-width="2"/>
<text x="620.0" y="566" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">Persona Agent</text>
<text x="620.0" y="590" font-size="15" fill="#6B7686" text-anchor="middle">Persona 생성 (Novice/Expert/Mobile)</text>
<text x="620.0" y="610" font-size="15" fill="#6B7686" text-anchor="middle">정리된 DOM → 다음 행동 결정</text>
<text x="620.0" y="630" font-size="15" fill="#6B7686" text-anchor="middle">click / type / scroll / back</text>
<rect x="800" y="540" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#1F5F8B" stroke-width="2"/>
<text x="950.0" y="566" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">Friction Detector · Diagnosis</text>
<text x="950.0" y="590" font-size="15" fill="#6B7686" text-anchor="middle">행동 로그 → Taxonomy 7종</text>
<text x="950.0" y="610" font-size="15" fill="#6B7686" text-anchor="middle">근거 · 심각도</text>
<rect x="1130" y="540" width="330" height="150" rx="8" fill="#FFFFFF" stroke="#1F5F8B" stroke-width="2"/>
<text x="1295.0" y="566" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">Improvement Agent · DOM 패처</text>
<text x="1295.0" y="590" font-size="15" fill="#6B7686" text-anchor="middle">개선안 3안 (영향/비용)</text>
<text x="1295.0" y="610" font-size="15" fill="#6B7686" text-anchor="middle">패치 4종 주입 → 재실험</text>
