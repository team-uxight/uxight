<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" font-family='"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif'><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2330"/></marker></defs><rect width="1600" height="820" fill="#FFFFFF"/>
<text x="60" y="48" font-size="24" font-weight="700" fill="#1B2330">시스템 구성도</text>
<text x="60" y="72" font-size="13" fill="#6B7686">웹 클라이언트(운영자 · 리서처) → API 서버 → Agent Runner(브라우저 · LLM).</text>
<rect x="60" y="100" width="1480" height="170" rx="10" fill="#EEF3F8"/>
<text x="80" y="124" font-size="16" font-weight="600" fill="#1F5F8B">클라이언트</text>
<rect x="60" y="300" width="1480" height="170" rx="10" fill="#EEF3F8"/>
<text x="80" y="324" font-size="16" font-weight="600" fill="#1F5F8B">서버</text>
<rect x="60" y="500" width="1480" height="220" rx="10" fill="#EEF3F8"/>
<text x="80" y="524" font-size="16" font-weight="600" fill="#1F5F8B">AI 모듈 (c) · Agent Runner</text>
<rect x="140" y="140" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
<text x="330.0" y="166" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">리서처 화면 (b)</text>
<text x="330.0" y="190" font-size="15" fill="#6B7686" text-anchor="middle">프로젝트 · Task · Persona 설정</text>
<text x="330.0" y="210" font-size="15" fill="#6B7686" text-anchor="middle">실행 모니터 · 진단 · 승인 · Before/After</text>
<rect x="1080" y="140" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
<text x="1270.0" y="166" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">운영자 화면 (b) · Admin</text>
<text x="1270.0" y="190" font-size="15" fill="#6B7686" text-anchor="middle">계정 · 권한 · 프로젝트 관리</text>
<text x="1270.0" y="210" font-size="15" fill="#6B7686" text-anchor="middle">모델 · 예산 · 사용량 · 감사 로그</text>
<rect x="640" y="150" width="320" height="80" rx="8" fill="#FFFFFF" stroke="#7A8594" stroke-width="2"/>
<text x="800.0" y="176" font-size="18" font-weight="700" fill="#6B7686" text-anchor="middle">관리자 웹 (b) — React + TS</text>
<text x="800.0" y="200" font-size="15" fill="#6B7686" text-anchor="middle">역할에 따라 두 화면</text>
<rect x="140" y="340" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2"/>
<text x="330.0" y="366" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">API 서버 (Spring)</text>
<text x="330.0" y="390" font-size="15" fill="#6B7686" text-anchor="middle">프로젝트 · 실행 · 진단 · 개선안 API</text>
<text x="330.0" y="410" font-size="15" fill="#6B7686" text-anchor="middle">인증 · 권한(운영자/리서처)</text>
<rect x="610" y="340" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2"/>
<text x="800.0" y="366" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">Watcher (오케스트레이터)</text>
<text x="800.0" y="390" font-size="15" fill="#6B7686" text-anchor="middle">Persona N개 병렬 · 동시 상한 · 멈춤 감지</text>
<text x="800.0" y="410" font-size="15" fill="#6B7686" text-anchor="middle">개선 루프: 부분 재실행 · 조기 종료</text>
<rect x="1080" y="340" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2"/>
<text x="1270.0" y="366" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">MySQL · 로그 저장소</text>
<text x="1270.0" y="390" font-size="15" fill="#6B7686" text-anchor="middle">프로젝트 · 실행 · 행동 로그(JSON)</text>
<text x="1270.0" y="410" font-size="15" fill="#6B7686" text-anchor="middle">진단 · 개선안 · 지표</text>
