<text x="1295.0" y="590" font-size="15" fill="#6B7686" text-anchor="middle">개선안 3안 (영향/비용)</text>
<text x="1295.0" y="610" font-size="15" fill="#6B7686" text-anchor="middle">패치 4종 주입 → 재실험</text>
