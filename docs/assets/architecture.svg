<text x="330.0" y="166" font-size="18" font-weight="700" fill="#1B2330" text-anchor="middle">관리자 웹 (b)</text>
<text x="330.0" y="190" font-size="15" fill="#6B7686" text-anchor="middle">프로젝트 · Task · Persona 설정</text>
<text x="330.0" y="210" font-size="15" fill="#6B7686" text-anchor="middle">진단 결과 · Before/After 대시보드</text>
