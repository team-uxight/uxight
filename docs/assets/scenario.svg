<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 830" width="1600" height="830" font-family='"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif'><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2330"/></marker></defs><rect width="1600" height="830" fill="#FFFFFF"/>
<text x="60" y="48" font-size="24" font-weight="700" fill="#1B2330">서비스 시나리오 — "쿠팡 와우 멤버십 해지하기"</text>
