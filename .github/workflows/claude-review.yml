# PR 자동 리뷰 — Claude(공식 code-review 플러그인)가 PR 에 줄 코멘트를 단다.
# 보조 리뷰라 필수 검사가 아니다(실패해도 병합을 막지 않는다). 비용은 PM 의 Claude API 크레딧.
# - 리뷰 시점: PR 을 열 때 · draft 에서 Ready 로 바꿀 때 · 다시 열 때. push 마다 다시 돌지 않는다(비용).
#   Claude 가 이미 코멘트를 단 PR 은 플러그인이 다시 리뷰하지 않는다.
# - draft · 외부 fork PR 은 건너뛴다(공개 저장소라 fork PR 에는 secret 이 없고, 크레딧을 남이 쓰지 않게).
name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # Claude GitHub 앱으로 인증할 때 필요
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # v1.0.261 — 공개 저장소라 태그 대신 커밋으로 고정한다
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33
        with:
          anthropic_api_key: ${{ secrets.GH_REVIEWER_CLAUDE }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "리뷰 코멘트는 한국어로 쓴다. 저장소 규칙은 AGENTS.md 와 docs/agent-safety.md 를 따른다."
