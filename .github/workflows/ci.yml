name: CI

on:
  pull_request:
    branches: [develop, main, fe, be, ai]
  push:
    branches: [develop, main]

# 바뀐 surface 만 검사한다 (paths-filter). 각 잡은 `make check` 의 해당 항목과 같다.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      api: ${{ steps.f.outputs.api }}
      agent: ${{ steps.f.outputs.agent }}
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
            api:
              - 'services/api/**'
            agent:
              - 'services/agent/**'
            infra:
              - 'docker-compose.yml'
              - 'Makefile'
              - '.env.example'
              - '.github/workflows/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test --if-present -- --run

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, cache-dependency-glob: services/agent/uv.lock }
      - uses: actions/setup-python@v5
        with: { python-version-file: services/agent/.python-version }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose 는 필수 변수(:?)가 비면 파싱에서 죽는다 — 검증용 더미 값을 준다.
      - run: docker compose config -q
        env:
          MYSQL_ROOT_PASSWORD: ci-throwaway
          MYSQL_PASSWORD: ci-throwaway

  # 시크릿 검사는 바뀐 경로와 무관하게 항상 돈다 (pre-commit 의 gitleaks 와 같은 검사).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks-action 은 조직 저장소에서 라이선스 키를 요구한다 → CLI(도커 이미지)로 직접 실행. pre-commit 과 같은 검사.
      - name: gitleaks (CLI)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8
          git /repo --redact --no-banner --exit-code 1
